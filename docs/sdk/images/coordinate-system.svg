<circle cx="318" cy="96" r="5.5" style="fill:var(--fg)"/>
<text x="449.6" y="82" text-anchor="end" class="l b" style="fill:var(--x)">+X</text>
<text x="459.6" y="82" text-anchor="start" class="s m">right</text>
<text x="332" y="24.1" text-anchor="start" class="l b" style="fill:var(--y)">+Y</text>
<text x="362" y="24.1" text-anchor="start" class="s m">up</text>
<text x="213.9" y="176.8" text-anchor="end" class="l b" style="fill:var(--z)">+Z</text>
<text x="213.9" y="194.8" text-anchor="end" class="s m">toward the shooter</text>
<text x="302" y="56" text-anchor="end" class="b">origin</text>
<text x="302" y="75" text-anchor="end" class="s m">top-left corner</text>
<text x="302" y="92" text-anchor="end" class="s m">of the screen</text>
</svg>
