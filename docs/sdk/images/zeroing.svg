<svg xmlns="http://www.w3.org/2000/svg" class="odg" viewBox="0 0 760 340" width="760" height="340" role="img">
<title>What zeroing corrects</title>
<desc>Side view. The Odyssey tracker sits below the bore and its line of sight is not parallel to it, so before zeroing the aimpoint misses the target. Zeroing records the offset from the tracker to the sight line and the angle that makes that line pass through the target.</desc>
