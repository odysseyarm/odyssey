[package]
name = "slot-table"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Slot choice for a small fixed table of keyed entries, verified with Verus"
repository = "https://github.com/odysseyarm/odyssey"
keywords = ["no-std", "verus", "table"]
categories = ["no-std", "data-structures"]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
ambiguous_negative_literals = "warn"
elided_lifetimes_in_paths = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_only)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[lints.cargo]
unused_dependencies = "deny"
