[package]
name = "atslite-common"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
ambiguous_negative_literals = "warn"
elided_lifetimes_in_paths = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
implicit_hasher = "allow"
must_use_candidate = "allow"
use_self = "warn"
unused_trait_names = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
literal_string_with_formatting_args = "allow"
fn_to_numeric_cast_any = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
map_err_ignore = "warn"
get_unwrap = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
rest_pat_in_fully_bound_structs = "warn"

[lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"

[dependencies]
# Local crates
donger-common = { path = "../donger-common", features = ["atslite"] }
atslite-transport = { path = "../atslite-transport" }

# Core
defmt = "1.0.1"
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
static_cell = "2.1.1"
bytemuck = "1.24.0"
backon = { version = "1.6", default-features = false, features = ["embassy-sleep"] }

# Embassy
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread"] }
embassy-nrf = { version = "0.9.0", features = ["nrf5340-app-s", "time-driver-rtc1", "gpiote", "defmt", "unstable-pac"] }
embassy-sync = "0.7.2"
embassy-time = { version = "0.5.0", features = ["defmt-timestamp-uptime-tms"] }
embassy-usb = { version = "0.5.1", default-features = false }
embassy-embedded-hal = "0.5.0"
embassy-futures = "0.1.2"

# HAL
embedded-hal-async = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embedded-io = "0.7"
embedded-io-async = "0.7"

# Power management
npm1300-rs = { git = "https://github.com/Abrahamh08/npm1300-rs" }
nrf-fuel-gauge = { git = "https://github.com/Abrahamh08/nrf-fuel-gauge" }
nrfxlib-sys = { git = "https://github.com/Abrahamh08/nrfxlib-sys", features = ["nrf_fuel_gauge", "nrf5340"] }

# IMU
icm426xx = { git = "https://github.com/Abrahamh08/icm426xx", default-features = false, features = ["async"] }

# Vision sensor
pag7665qn = { path = "../pag7665qn" }

# Math
nalgebra = { version = "0.35", default-features = false, features = ["libm"] }

# BLE
trouble-host = { git = "https://github.com/embassy-rs/trouble", default-features = false, features = ["defmt", "gatt", "peripheral", "derive", "security", "default-packet-pool"] }
bt-hci = { version = "0.8", default-features = false, features = ["defmt"] }
icmsg = { git = "https://github.com/0e4ef622/icmsg-rs" }

# Protocol
odyssey-protocol = { path = "../../crates/odyssey-protocol", default-features = false, features = ["minicbor", "serde-no-std", "defmt"] }
postcard = { version = "1.1.3", features = ["use-defmt"] }
better-ota = { path = "../better-ota" }
better-boot = { path = "../better-boot" }
embedded-storage = "0.3"

# Settings persistence
cfg-noodle = { git = "https://github.com/tweedegolf/cfg-noodle", rev = "87e468b", default-features = false, features = ["defmt"] }

heapless = "0.9"

# RNG
rand_core = { version = "0.6", default-features = false }
rand_chacha = { version = "0.3", default-features = false }

[features]
default = []

[patch.crates-io]
minicbor = { git = "https://github.com/Abrahamh08/minicbor" }
minicbor-derive = { git = "https://github.com/Abrahamh08/minicbor" }
minicbor-serde = { git = "https://github.com/Abrahamh08/minicbor" }
embassy-nrf = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
