[package]
name = "lite1-net-core"
version = "0.1.0"
edition = "2024"

[lints.rust]
missing_debug_implementations = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
ambiguous_negative_literals = "warn"
dead_code_pub_in_binary = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_imports = "warn"
elided_lifetimes_in_paths = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
implicit_hasher = "allow"
must_use_candidate = "allow"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_to_numeric_cast_any = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
rc_mutex = "warn"

[lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"

[dependencies]
defmt-rtt = "1.0.0"
embassy-executor = { version = "0.9.1", features = ["defmt", "arch-cortex-m", "executor-thread"] }
embassy-nrf = { version = "0.9.0", features = ["defmt", "time-driver-rtc1", "gpiote", "time", "unstable-pac", "nrf5340-net"] }
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime-ms"] }
nrf-sdc = { version = "0.4.0", features = ["defmt", "nrf5340-net", "peripheral"] }
nrf-mpsl = { version = "0.3.0", features = ["defmt", "nrf5340-net", "critical-section-impl"] }
embedded-storage = "0.3"

cortex-m-rt = "0.7.5"
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
panic-probe = { version = "1", features = ["defmt", "print-defmt"] }
icmsg = { git = "https://github.com/0e4ef622/icmsg-rs" }
static_cell = "2.1.1"
defmt = "1.0.1"
bt-hci = { version = "0.6.0", features = ["defmt"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }

[profile.dev]
debug = 2
debug-assertions = true
incremental = false
opt-level = 'z'
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
lto = 'fat'
opt-level = 'z'
overflow-checks = false

# Build scripts and proc macros run unoptimized: clean builds finish sooner.
[profile.dev.build-override]
codegen-units = 8
debug = false
opt-level = 0

[profile.release.build-override]
codegen-units = 8
debug = true
opt-level = 0

[build-dependencies]
memory-spec = "0.3.0"

[patch.crates-io]
# Needs https://github.com/embassy-rs/bt-hci/pull/63.
bt-hci = { git = "https://github.com/embassy-rs/bt-hci" }
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc.git" }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc.git" }
