[package]
edition = "2024"
name = "better-dfu"
version = "0.2.0"

description = "An implementation of the USB DFU 1.1 protocol, using embassy-boot (extended fork)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/odysseyarm/ats_common"
categories = [
    "embedded",
    "no-std",
    "asynchronous"
]

[lints.rust]
missing_debug_implementations = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
ambiguous_negative_literals = "warn"
dead_code_pub_in_binary = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_imports = "warn"
elided_lifetimes_in_paths = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
implicit_hasher = "allow"
must_use_candidate = "allow"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_to_numeric_cast_any = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
rc_mutex = "warn"

[lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"

[dependencies]
defmt = { version = "1.0.1", optional = true }
log = { version = "0.4.17", optional = true }

bitflags = "2.4.1"
cortex-m = { version = "0.7.7", features = ["inline-asm"], optional = true }
embassy-boot = "0.6.1"
embassy-futures = "0.1.2"
embassy-sync = "0.7.2"
embassy-time = "0.5.0"
embassy-usb = { version = "0.5.1", default-features = false }
embedded-storage = "0.3.1"
esp32c3-hal = { version = "0.13.0", optional = true, default-features = false }

[dev-dependencies]
# Named here so Cargo.lock carries the `std` time driver the tests link; a
# vendored build cannot fetch what only a command-line feature asks for.
embassy-time = { version = "0.5.0", features = ["std"] }

[features]
dfu = []
application = []
defmt = ["dep:defmt", "embassy-boot/defmt", "embassy-usb/defmt"]
log = ["dep:log"]
cortex-m = ["dep:cortex-m"]
esp32c3-hal = ["dep:esp32c3-hal"]
ed25519-dalek = ["embassy-boot/ed25519-dalek", "_verify"]
ed25519-salty = ["embassy-boot/ed25519-salty", "_verify"]

# Internal features
_verify = []
