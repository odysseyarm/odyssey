[package]
name = "marker-control-board-bootloader"
version = "0.1.1"
edition = "2024"

license = "MIT"
description = "Single-core USB DFU bootloader for nRF52833 marker control board"

[lints.rust]
missing_debug_implementations = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
ambiguous_negative_literals = "warn"
dead_code_pub_in_binary = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_imports = "warn"
elided_lifetimes_in_paths = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
implicit_hasher = "allow"
must_use_candidate = "allow"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_to_numeric_cast_any = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
rc_mutex = "warn"

[lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"


[dependencies]
odyssey-version = { path = "../../crates/odyssey-version" }
better-dfu = { path = "../better-dfu", features = ["dfu", "cortex-m"] }
embassy-boot = "0.6.1"
embassy-nrf = { version = "0.9.0", features = ["nrf52833", "time-driver-rtc1", "time", "nfc-pins-as-gpio", "unstable-pac"] }
embassy-time = "0.5.0"
embassy-usb = { version = "0.5.1", default-features = false }
embassy-sync = "0.7.2"
embassy-futures = "0.1.2"
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"

[build-dependencies]
memory-spec = "0.3.0"

[patch.crates-io]
embassy-nrf = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", rev = "db65b00" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 2
