name: Push to the Odyssey binary cache
description: Sign and upload approved output closures or public build closures to cache.odysseyarm.com
inputs:
  paths:
    description: Whitespace-separated approved output paths; runtime closures only
    required: false
    default: ''
  public-builds:
    description: Whitespace-separated firmware, SDK or xtask installables; includes build-time layers and public sources
    required: false
    default: ''
  signing-key:
    description: Nix secret signing key (NIX_SIGNING_KEY)
    required: true
  access-key-id:
    required: true
  secret-access-key:
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        NIX_SIGNING_KEY: ${{ inputs.signing-key }}
        PUBLIC_BUILDS: ${{ inputs.public-builds }}
        CACHE_ACTION_PATH: ${{ github.action_path }}
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
      run: nix shell --inputs-from . nixpkgs#python3 nixpkgs#zstd nixpkgs#jq --command bash "$CACHE_ACTION_PATH/upload.sh"
