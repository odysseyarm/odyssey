name: Save the host dependency layer
description: Save the host dependency layer's closure to the Actions cache; fails if the closure references odyssey-cv sources
inputs:
  path:
    description: Store path of the host dependency layer (setup-nix output host-deps-path)
    required: true
runs:
  using: composite
  steps:
    - id: pack
      shell: bash
      env:
        LAYER: ${{ inputs.path }}
      run: |
        set -eu
        private=$(nix flake archive --json --dry-run | jq -r '.inputs["odyssey-cv"].path')
        if nix path-info -r "$LAYER" | grep -qxF "$private"; then
          echo "host dependency layer references the private odyssey-cv source; refusing to cache it" >&2
          exit 1
        fi
        nix copy --to "file://$RUNNER_TEMP/host-deps-cache?compression=zstd&parallel-compression=true" "$LAYER"
        echo "key=host-deps-$(basename "$LAYER")" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/host-deps-cache
        key: ${{ steps.pack.outputs.key }}
