name: Set up Odyssey Nix
description: Install pinned Nix with the Odyssey binary cache as a substituter
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      with:
        extra_nix_config: |
          max-jobs = 2
          cores = 2
          extra-substituters = https://cache.odysseyarm.com
          extra-trusted-public-keys = odysseyarm-1:pQObqsDwZYUoo1CsL/NGvRPF+aAfKtDyZALe7CVyuI0=
