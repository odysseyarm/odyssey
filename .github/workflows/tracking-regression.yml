name: Tracking Regression

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

jobs:
  tracking:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ODYSSEY_CV_TOKEN }}@github.com/odysseyarm/odyssey-cv.git.insteadOf
      GIT_CONFIG_VALUE_0: ssh://git@github.com/odysseyarm/odyssey-cv.git
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
      - name: Test regression contracts
        run: nix build -L --no-link .#checks.x86_64-linux.tracking-tests
      - name: Build tracking runner
        run: |
          runner=$(nix build -L --no-link --print-out-paths .#tracking)
          echo "TRACKING_REGRESSION=$runner/bin/tracking-regression" >> "$GITHUB_ENV"
      - name: Run deterministic tracking suite
        run: '"$TRACKING_REGRESSION" suite tracking-report.json'
      - name: Run display-mapping suite
        run: '"$TRACKING_REGRESSION" surface-suite surface-report.json'
      - name: Check Rerun recording semantics
        run: nix develop .#tracking --command python3 -m unittest discover -s tools/tracking_scene -p test_rerun_export.py -v
      - name: Render and round-trip calibrated Blender scenes
        run: |
          nix develop .#tracking --command bash -euc '
            V="$TRACKING_REGRESSION"
            blender -b --python-exit-code 1 --python tools/tracking_scene/blender_scene.py -- \
              --validator "$V" selfcheck scene-tool-evidence &&
            python3 tools/tracking_scene/rerun_export.py \
              scene-tool-evidence/authored-environment/scene.json scene-tool-evidence/environment.rrd \
              --images scene-tool-evidence/authored-environment/manifest.json \
              --validator "$V" --self-check'
      - name: Upload tracking evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tracking-report
          path: |
            tracking-report.json
            surface-report.json
            scene-tool-evidence/
          if-no-files-found: warn
