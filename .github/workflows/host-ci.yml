name: Host CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ODYSSEY_CV_TOKEN }}@github.com/odysseyarm/odyssey-cv.git.insteadOf
      GIT_CONFIG_VALUE_0: ssh://git@github.com/odysseyarm/odyssey-cv.git
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
      - name: Check public cache boundaries
        run: bash .github/actions/push-cache/test.sh
      - name: Build host applications and repository tools
        id: deps
        run: |
          nix build -L --no-link .#host .#xtask
          echo "path=$(nix eval --raw .#host.cargoArtifacts.outPath)" >> "$GITHUB_OUTPUT"
      # Pushed before tests and lint so a failing check still warms the next run.
      - name: Push host dependency layer
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/push-cache
        with:
          paths: ${{ steps.deps.outputs.path }}
          public-builds: .#host.cargoArtifacts .#xtask
          signing-key: ${{ secrets.NIX_SIGNING_KEY }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Test host applications and repository tools
        run: nix build -L --no-link .#checks.x86_64-linux.host-tests .#checks.x86_64-linux.xtask-tests
      - name: Lint host applications
        run: nix build -L --no-link .#checks.x86_64-linux.host-lint .#checks.x86_64-linux.host-lint-bins
