name: Net Core Release

# Build and publish an nRF5340 net-core image when a <device>-netcore-vN tag is
# pushed, e.g. atslite1-netcore-v1. N is the net core's release counter, the
# literal in its src/main.rs, and the tag has to agree with it.
#
# Releases made with `cargo xtask firmware <board> release-netcore` already exist by the time the tag
# does, so this workflow stands down for them rather than overwrite assets the
# manifest may already hash. It only builds for tags pushed by hand.
#
# The build runs `cargo xtask firmware <board> dist-netcore`, the command a local release runs, so the
# two cannot drift.

#
# Run it by hand from the Actions tab (or `gh workflow run`) to test the build
# as if that tag had been pushed: a run from a branch builds and uploads the artifacts but
# publishes nothing.

on:
  push:
    tags:
      - '*-netcore-v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build as, e.g. atslite1-netcore-v1. Builds only; nothing is published.
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      skip: ${{ steps.exists.outputs.skip }}
      device: ${{ steps.parse.outputs.device }}
      release: ${{ steps.parse.outputs.release }}
      board: ${{ steps.parse.outputs.board }}
      board_dir: ${{ steps.parse.outputs.board_dir }}
      crate_dir: ${{ steps.parse.outputs.crate_dir }}
    steps:
      - uses: actions/checkout@v5
      - name: Skip tags that already have a release
        id: exists
        # A manual run is a dry run, so an existing release does not stop it.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; nothing to build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the tag against the net-core source
        id: parse
        if: steps.exists.outputs.skip != 'true'
        run: |
          set -eu
          device="${RELEASE_TAG%-netcore-v*}"
          release="${RELEASE_TAG##*-netcore-v}"
          case "$device" in
            atslite1) board=lite1 ;;
            legacy-atslite1) board=legacy-atslite ;;
            *) echo "Unknown device '$device' in tag $RELEASE_TAG" >&2; exit 1 ;;
          esac
          case "$release" in
            ''|*[!0-9]*) echo "Release '$release' is not a number" >&2; exit 1 ;;
          esac
          crate_dir="firmware/$board-net-core"
          source_release=$(cargo xtask firmware release-counter "$crate_dir/src/main.rs")
          if [ "$release" != "$source_release" ]; then
            echo "Tag release ($release) does not match $crate_dir/src/main.rs ($source_release)" >&2
            exit 1
          fi
          {
            echo "device=$device"
            echo "release=$release"
            echo "board=$board"
            echo "board_dir=firmware/$board"
            echo "crate_dir=$crate_dir"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build net core
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustup resolves the repo's rust-toolchain.toml from here, so the target and
      # tools are added to the pinned nightly.
      - name: Install the target and tools
        working-directory: ${{ needs.resolve.outputs.crate_dir }}
        run: |
          rustup target add thumbv8m.main-none-eabi
          rustup component add llvm-tools
      # nrf-sdc-sys and nrf-mpsl-sys run bindgen over headers that need the
      # bare-metal libc headers.
      - name: Install the ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libclang-dev
          arm=/usr/lib/arm-none-eabi
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$arm -I$arm/include" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(printf '%s\n' /usr/lib/llvm-*/lib | sort -V | tail -n 1)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ needs.resolve.outputs.crate_dir }} -> target
          shared-key: netcore-${{ needs.resolve.outputs.device }}
      - name: Build the release artifacts
        env:
          BOARD: ${{ needs.resolve.outputs.board }}
        run: cargo xtask firmware "$BOARD" dist-netcore
      - uses: actions/upload-artifact@v6
        with:
          name: netcore
          path: ${{ needs.resolve.outputs.board_dir }}/dist-netcore

  github-release:
    name: Create GitHub Release
    needs: [resolve, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ needs.resolve.outputs.release }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: netcore
          path: dist
      - name: Publish
        run: |
          set -eu
          # A local release may have landed while the build ran.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME appeared during the build; leaving it alone."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Net core release $RELEASE" \
            --notes "Net core (BLE controller) firmware release $RELEASE. Installed by the desktop updater when a firmware release names this release. Do not delete." \
            dist/net-core.bin dist/net-core.hex dist/net-core.elf
