name: UniFFI Build

# Reusable workflow that builds (and smoke-tests) all uniffi bindgen
# language packages. Called by uniffi-ci.yml (PRs / pushes) and
# uniffi-release.yml (tags). To add a new language, add its build job(s)
# here and a matching publish job in uniffi-release.yml.
#
# Not to be confused with ffi-build.yml, which builds the separate cbindgen
# based C/C++ FFI library (odyssey-hub-client-ffi).
#
# Every Rust artifact (wheels, C# natives, the C# bindings) is a Nix derivation
# from nix/sdk.nix, built with Crane: linux through cargo-zigbuild against a
# glibc 2.17 / musl baseline (manylinux2014 / musllinux_1_2, audited by maturin),
# windows through cargo-xwin against a hash-pinned MSVC CRT + Windows SDK, macos
# natively on a darwin builder. The public setup-nix cache is safe here: the SDK
# lockfiles do not resolve the private odyssey-cv dependency.
#
# All artifacts follow the naming scheme: <language>-<platform>-<target>

on:
  workflow_call:
    inputs:
      version:
        description: Package version override (e.g. from the release tag); empty = project defaults
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Wheel builds use the project-local uniffi-bindgen: maturin detects the
  # workspace bin and runs `cargo run --bin uniffi-bindgen`, so bindings match
  # the uniffi version in Cargo.lock. The pip pin in pyproject.toml only covers
  # builds where that bin is unavailable, so this job fails if it drifts from
  # the lockfile. (Pure text check; needs no Nix.)
  check-pyproject-pin:
    name: Check pyproject uniffi-bindgen pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify pin matches Cargo.lock
        run: |
          version=$(grep -A1 '^name = "uniffi"$' sdk/odyssey-hub-client-uniffi/Cargo.lock | grep '^version' | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "Could not find uniffi version in Cargo.lock" >&2
            exit 1
          fi
          pin="${version%.*}.*"
          if ! grep -qF "uniffi-bindgen==$pin" sdk/odyssey-hub-client-uniffi/pyproject.toml; then
            echo "pyproject.toml build-system pin does not match Cargo.lock uniffi $version — update it to uniffi-bindgen==$pin" >&2
            exit 1
          fi

  python-linux:
    name: Python linux ${{ matrix.platform.manylinux }} ${{ matrix.platform.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - target: x86_64
            manylinux: auto
          - target: x86
            manylinux: auto
          - target: aarch64
            manylinux: auto
          - target: armv7
            manylinux: auto
          # No s390x wheel: json5 -> pest pins psm to =0.1.24, whose s390x
          # assembly does not build with the manylinux image's binutils. The
          # SDK drives USB devices from desktops, so a mainframe wheel buys
          # nothing anyway.
          - target: ppc64le
            manylinux: auto
          - target: x86_64
            manylinux: musllinux_1_2
          - target: x86
            manylinux: musllinux_1_2
          - target: aarch64
            manylinux: musllinux_1_2
          - target: armv7
            manylinux: musllinux_1_2
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
        with:
          public-cache: 'true'
      # maturin (in the sandbox) builds the wheel with zig as the linker and
      # audits it against the manylinux2014 / musllinux_1_2 policy.
      - name: Build wheels
        id: build
        run: echo "out=$(nix build -L --no-link --print-out-paths .#sdk-python-linux-${{ matrix.platform.manylinux }}-${{ matrix.platform.target }})" >> "$GITHUB_OUTPUT"
      - name: Collect wheels
        run: |
          mkdir -p dist
          cp -L "${{ steps.build.outputs.out }}"/dist/*.whl dist/
      # pip install + import, in a derivation, for the wheel the builder can run.
      - name: Test wheel
        if: matrix.platform.target == 'x86_64' && matrix.platform.manylinux == 'auto'
        run: nix build -L --no-link .#checks.x86_64-linux.sdk-python-wheel-import
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: python-linux-${{ matrix.platform.manylinux }}-${{ matrix.platform.target }}
          path: dist

  python-windows:
    name: Python windows ${{ matrix.target }} (cross via xwin)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
        with:
          public-cache: 'true'
      # maturin cross-compiles this target through its cargo-xwin backend; the
      # sysroot is the hash-pinned one from nix/xwin.nix.
      - name: Build wheels
        id: build
        run: echo "out=$(nix build -L --no-link --print-out-paths .#sdk-python-windows-${{ matrix.target }})" >> "$GITHUB_OUTPUT"
      - name: Collect wheels
        run: |
          mkdir -p dist
          cp -L "${{ steps.build.outputs.out }}"/dist/*.whl dist/
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: python-windows-${{ matrix.target }}
          path: dist

  python-macos:
    name: Python macos ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
        with:
          public-cache: 'true'
      - name: Build wheels
        id: build
        run: echo "out=$(nix build -L --no-link --print-out-paths .#sdk-python-macos-${{ matrix.target }})" >> "$GITHUB_OUTPUT"
      - name: Collect wheels
        run: |
          mkdir -p dist
          cp -L "${{ steps.build.outputs.out }}"/dist/*.whl dist/
      - name: Test wheel
        if: matrix.target == 'aarch64'
        run: nix build -L --no-link .#checks.aarch64-darwin.sdk-python-wheel-import
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: python-macos-${{ matrix.target }}
          path: dist

  # C# NuGet ships one package with all native libs (runtimes/<rid>/native).
  # Natives: linux via cargo-zigbuild and windows via cargo-xwin in Nix
  # derivations on one linux runner, macos via Nix on the macos runner.
  dotnet-natives-linux:
    name: DotNet natives linux + windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
        with:
          public-cache: 'true'
      - name: Build natives (nix)
        run: |
          set -eu
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            out=$(nix build -L --no-link --print-out-paths ".#sdk-dotnet-native-$triple")
            mkdir -p "natives/$triple"
            cp -L "$out"/* "natives/$triple/"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: dotnet-native-x86_64-unknown-linux-gnu
          path: natives/x86_64-unknown-linux-gnu/libohc_uniffi.so
      - uses: actions/upload-artifact@v6
        with:
          name: dotnet-native-aarch64-unknown-linux-gnu
          path: natives/aarch64-unknown-linux-gnu/libohc_uniffi.so
      - uses: actions/upload-artifact@v6
        with:
          name: dotnet-native-x86_64-pc-windows-msvc
          path: natives/x86_64-pc-windows-msvc/ohc_uniffi.dll

  dotnet-natives-macos:
    name: DotNet natives macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
        with:
          public-cache: 'true'
      - name: Build macos natives (nix)
        run: |
          set -eu
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            out=$(nix build -L --no-link --print-out-paths ".#sdk-dotnet-native-$triple")
            mkdir -p "natives/$triple"
            cp -L "$out"/* "natives/$triple/"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: dotnet-native-aarch64-apple-darwin
          path: natives/aarch64-apple-darwin/libohc_uniffi.dylib
      - uses: actions/upload-artifact@v6
        with:
          name: dotnet-native-x86_64-apple-darwin
          path: natives/x86_64-apple-darwin/libohc_uniffi.dylib

  dotnet-package:
    name: DotNet pack NuGet
    runs-on: ubuntu-latest
    needs: [dotnet-natives-linux, dotnet-natives-macos]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
        with:
          public-cache: 'true'
      - name: Download natives
        uses: actions/download-artifact@v6
        with:
          pattern: dotnet-native-*
      - name: Place natives in target dirs
        run: |
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin; do
            mkdir -p "sdk/odyssey-hub-client-uniffi/target/$triple/release"
            mv dotnet-native-"$triple"/* "sdk/odyssey-hub-client-uniffi/target/$triple/release/"
          done
      # uniffi-bindgen-cs is built from the pinned NordSecurity tag in nix/sdk.nix
      # (keep it in sync with UNIFFI_BINDGEN_CS_TAG in crates/xtask/src/sdk.rs);
      # the derivation reads the metadata of the Nix-built x86_64 linux native.
      - name: Generate C# bindings
        run: |
          set -eu
          out=$(nix build -L --no-link --print-out-paths .#sdk-dotnet-csharp-bindings)
          mkdir -p sdk/odyssey-hub-client-uniffi/dotnet/OdysseyHubClient/OdysseyHubClient/generated
          cp -rL "$out"/. sdk/odyssey-hub-client-uniffi/dotnet/OdysseyHubClient/OdysseyHubClient/generated/
          chmod -R u+w sdk/odyssey-hub-client-uniffi/dotnet/OdysseyHubClient/OdysseyHubClient/generated
      # Packing is host-native: the macOS natives above come from another runner,
      # so the package cannot be one derivation. The .NET SDK and every NuGet
      # package it restores are pinned by Nix (sdk-dotnet-sdk, sdk-dotnet-nuget-deps).
      - name: Pack
        run: nix run .#sdk-dotnet-pack -- "${{ inputs.version }}"
      - uses: actions/upload-artifact@v6
        with:
          name: dotnet-nuget
          path: sdk/odyssey-hub-client-uniffi/dotnet/OdysseyHubClient/nugets/*.nupkg
