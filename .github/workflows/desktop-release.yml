name: Desktop Release

# Build and publish the Windows installer when an odyssey-desktop-vX.Y.Z tag is
# pushed. The tag version must match apps/odyssey-desktop/Cargo.toml.
#
# WiX runs on Windows only, so the bundle is built on a windows runner rather
# than cross-compiled the way the FFI libraries are.
#
# odyssey-hub-server reaches odyssey-cv over an SSH git URL that this runner
# has no key for, so the checkout rewrites that URL to an authenticated HTTPS
# one. ODYSSEY_CV_TOKEN is a fine-grained PAT scoped to odysseyarm/odyssey-cv,
# Contents: read.
#
# Run it by hand from the Actions tab (or `gh workflow run`) to test the build
# without a tag: a run from a branch builds and uploads the artifacts but
# publishes nothing.

on:
  push:
    tags:
      - 'odyssey-desktop-v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

env:
  DIOXUS_CLI_VERSION: 0.7.10

jobs:
  check-version:
    name: Check tag matches crate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag version
        id: check
        run: |
          crate_version=$(grep -m1 '^version' apps/odyssey-desktop/Cargo.toml | cut -d'"' -f2)
          # A manual run is from a branch, so there is no tag to compare.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag_version="${GITHUB_REF_NAME#odyssey-desktop-v}"
            if [ "$tag_version" != "$crate_version" ]; then
              echo "Tag version ($tag_version) does not match apps/odyssey-desktop/Cargo.toml version ($crate_version)" >&2
              exit 1
            fi
          fi
          echo "version=$crate_version" >> "$GITHUB_OUTPUT"

  bundle:
    name: Bundle MSI
    needs: check-version
    # Set the DESKTOP_RUNNER repository variable to a self-hosted Windows
    # runner's label to build there instead. A hosted runner starts empty and
    # compiles all ~670 crates every time, around 20 minutes; a self-hosted one
    # keeps target/ and ~/.cargo between runs and only rebuilds what changed.
    runs-on: ${{ vars.DESKTOP_RUNNER || 'windows-latest' }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Authenticate the odyssey-cv git dependency
        run: |
          git config --global url."https://x-access-token:${{ secrets.ODYSSEY_CV_TOKEN }}@github.com/odysseyarm/odyssey-cv.git".insteadOf "ssh://git@github.com/odysseyarm/odyssey-cv.git"
      - uses: actions/checkout@v5
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "26.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # A self-hosted runner keeps its own target/, so the cache round-trip is
      # pure overhead there. On a hosted one the shared key keeps a single
      # cache across tags instead of one per build, so only app crates rebuild.
      - uses: Swatinem/rust-cache@v2
        if: ${{ !vars.DESKTOP_RUNNER }}
        with:
          workspaces: ". -> target"
          cache-all-crates: true
          shared-key: desktop-windows
      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: Install dioxus-cli
        run: cargo binstall --no-confirm --locked dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
      - name: Bundle
        working-directory: apps/odyssey-desktop
        run: dx bundle --desktop --package-types msi
      - name: Collect the installer
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Recurse -Filter '*.msi' -Path target/dx |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi) { Write-Error 'dx bundle produced no msi'; exit 1 }
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item $msi.FullName "dist/Odyssey-$env:VERSION-win-x64.msi"
      - uses: actions/upload-artifact@v6
        with:
          name: odyssey-desktop-msi
          path: dist

  appimage:
    name: Bundle AppImage
    needs: check-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Authenticate the odyssey-cv git dependency
        run: |
          git config --global url."https://x-access-token:${{ secrets.ODYSSEY_CV_TOKEN }}@github.com/odysseyarm/odyssey-cv.git".insteadOf "ssh://git@github.com/odysseyarm/odyssey-cv.git"
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libudev-dev \
            libdbus-1-dev libssl-dev pkg-config fuse3 mold \
            libayatana-appindicator3-dev
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "26.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The workspace links a webview, a gRPC server and a tray, so linking is
      # a real slice of the build; mold cuts it to a fraction of GNU ld.
      - name: Link with mold
        run: echo 'RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> "$GITHUB_ENV"
      # save-if keeps one cache per lockfile rather than one per tag build, so
      # a release that only moves app code reuses the dependency objects.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-all-crates: true
          shared-key: desktop-linux
      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: Install dioxus-cli
        run: cargo binstall --no-confirm --locked dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
      - name: Bundle
        working-directory: apps/odyssey-desktop
        run: dx bundle --desktop --package-types appimage
      # Two defects in the bundler this image comes out of, both documented
      # upstream in tauri (dx shells out to tauri-bundler):
      #
      #   - libwebkit2gtk is bundled but none of the helper binaries it
      #     spawns, and their path is compiled into the library rather than
      #     read from the environment, so the image only ran on a host that
      #     already had webkit2gtk-4.1 at a matching version
      #     (tauri-apps/tauri#12463).
      #   - linuxdeploy sweeps in libwayland-client and the GL stack, which
      #     must come from the host: against Mesa 25+ the bundled copies make
      #     eglGetDisplay fail, WebKitWebProcess aborts, and the window never
      #     appears with nothing printed (tauri-apps/tauri#15665, #15976).
      #
      # Unpack, add the helpers, drop the libraries that belong to the host,
      # repack.
      - name: Collect the AppImage
        run: |
          set -eu
          img=$(find target/dx -name '*.AppImage' -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          if [ -z "$img" ]; then echo "dx bundle produced no AppImage" >&2; exit 1; fi

          chmod +x "$img"
          "$img" --appimage-extract >/dev/null
          helpers=/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1
          if [ ! -x "$helpers/WebKitNetworkProcess" ]; then
            echo "no webkit helpers at $helpers" >&2; exit 1
          fi
          mkdir -p "squashfs-root$helpers"
          cp -a "$helpers/." "squashfs-root$helpers/"

          # The pkg2appimage excludelist calls these out: they are the ABI
          # boundary with the host's graphics driver.
          for lib in libwayland-client libwayland-cursor libwayland-egl \
                     libxkbcommon libEGL libGL libGLX libGLdispatch libgbm \
                     libdrm libglapi; do
            rm -f squashfs-root/usr/lib/$lib.so*
          done

          curl -fsSLo /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          mkdir -p dist
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            squashfs-root "dist/Odyssey-$VERSION-x86_64.AppImage"
          chmod +x "dist/Odyssey-$VERSION-x86_64.AppImage"

          # Prove the helpers made it in, so a silent repack failure cannot
          # ship an image that dies on a clean machine.
          "dist/Odyssey-$VERSION-x86_64.AppImage" --appimage-extract \
            "usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/WebKitNetworkProcess" >/dev/null
          test -x "squashfs-root$helpers/WebKitNetworkProcess"
      - uses: actions/upload-artifact@v6
        with:
          name: odyssey-desktop-appimage
          path: dist

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-version, bundle, appimage]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: odyssey-desktop-msi
      - uses: actions/download-artifact@v6
        with:
          name: odyssey-desktop-appimage
      # Re-running a tag has to replace the artifacts rather than fail on the
      # release that already exists, so create only when it does not.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Odyssey Desktop v$VERSION" \
              --notes "Odyssey $VERSION — Windows installer and Linux AppImage."
          fi
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --clobber \
            "Odyssey-$VERSION-win-x64.msi" \
            "Odyssey-$VERSION-x86_64.AppImage"
