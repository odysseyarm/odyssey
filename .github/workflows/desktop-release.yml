name: Desktop Release

# odyssey-hub-server reaches odyssey-cv over an SSH git URL that this runner
# has no key for, so job-scoped Git config rewrites that URL to an authenticated HTTPS
# one. ODYSSEY_CV_TOKEN is a fine-grained PAT scoped to odysseyarm/odyssey-cv,
# Contents: read.
#

on:
  push:
    tags:
      - 'odyssey-desktop-v*.*.*'
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish release; disable for lab verification only
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check-version:
    name: Choose stable or nightly version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release_type: ${{ steps.check.outputs.release_type }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Choose release version
        id: check
        run: |
          crate_version=$(grep -m1 '^version' crates/odyssey-desktop/Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#odyssey-desktop-v}"
            if [ "$version" != "$crate_version" ]; then
              echo "Tag version ($version) does not match crates/odyssey-desktop/Cargo.toml version ($crate_version)" >&2
              exit 1
            fi
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable desktop tags require clean X.Y.Z, got $version" >&2
              exit 1
            fi
            release_type=stable
            release_tag="$GITHUB_REF_NAME"
          else
            IFS=. read -r major minor patch extra <<< "$crate_version"
            if [ -n "$extra" ] || ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]; then
              echo "Cargo.toml version must be clean X.Y.Z, got $crate_version" >&2
              exit 1
            fi
            next_patch=$((patch + 1))
            stamp=$(date -u +%Y%m%d.t%H%M%S)
            sha=$(git rev-parse --short=12 "$GITHUB_SHA")
            version="$major.$minor.$next_patch-nightly.$stamp.g$sha"
            release_type=nightly
            release_tag="odyssey-desktop-v$version"
          fi
          {
            echo "version=$version"
            echo "release_type=$release_type"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

  windows-build:
    name: Cross-build Windows executables
    needs: check-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      ODYSSEY_BUILD_VERSION: ${{ needs.check-version.outputs.version }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ODYSSEY_CV_TOKEN }}@github.com/odysseyarm/odyssey-cv.git.insteadOf
      GIT_CONFIG_VALUE_0: ssh://git@github.com/odysseyarm/odyssey-cv.git
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
      - name: Build Windows release and GUI smoke packages
        run: |
          out=$(nix build --impure -L --no-link --print-out-paths .#desktop-windows)
          gui=$(nix build --impure -L --no-link --print-out-paths .#desktop-windows-gui)
          mkdir prebuilt-windows
          cp -rL "$out"/. prebuilt-windows/
          mkdir windows-gui-package
          cp -rL "$gui"/. windows-gui-package/
      - uses: actions/upload-artifact@v6
        with:
          name: odyssey-desktop-windows-prebuilt
          path: prebuilt-windows
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: odyssey-desktop-windows-gui
          path: windows-gui-package
          if-no-files-found: error

  bundle:
    name: Bundle MSI
    needs: [check-version, windows-build]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      ODYSSEY_BUILD_VERSION: ${{ needs.check-version.outputs.version }}
      ODYSSEY_REPO: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: odyssey-desktop-windows-prebuilt
          path: prebuilt-windows
      - name: Bundle the online installer
        shell: bash
        run: ./prebuilt-windows/tools/xtask.exe desktop bundle online --prebuilt prebuilt-windows
      - name: Bundle the full installer
        shell: bash
        run: ./prebuilt-windows/tools/xtask.exe desktop bundle full --prebuilt prebuilt-windows
      - name: Collect the installers
        shell: bash
        run: |
          mkdir dist
          for variant in online full; do
            set -- crates/odyssey-desktop/dist/$variant/*.msi
            if [ ! -f "$1" ]; then echo "cargo-packager produced no $variant msi" >&2; exit 1; fi
            suffix=""; [ "$variant" = full ] && suffix="-full"
            cp "$1" "dist/Odyssey-$VERSION-win-x64$suffix.msi"
          done
          ls -l dist
      - uses: actions/upload-artifact@v6
        with:
          name: odyssey-desktop-msi
          path: dist

  windows-installer-smoke:
    name: Smoke-test Windows MSI installers
    needs: [check-version, bundle]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: odyssey-desktop-msi
          path: dist
      - name: Install, validate, and uninstall both MSI variants
        shell: powershell
        run: |
          ./.github/scripts/windows-installer-smoke.ps1 `
            -InstallerPath "dist/Odyssey-${{ needs.check-version.outputs.version }}-win-x64.msi"
          ./.github/scripts/windows-installer-smoke.ps1 `
            -InstallerPath "dist/Odyssey-${{ needs.check-version.outputs.version }}-win-x64-full.msi"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: odyssey-desktop-windows-msi-smoke
          path: windows-installer-smoke
          if-no-files-found: ignore

  windows-ui-smoke:
    name: Await isolated Windows GUI result
    needs: [windows-build, windows-installer-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          LAB_STATUS_ACTOR: ${{ vars.ODYSSEY_LAB_STATUS_ACTOR }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const actor = process.env.LAB_STATUS_ACTOR;
            if (!actor) throw new Error('ODYSSEY_LAB_STATUS_ACTOR must identify trusted host broker');
            const statusContext = `odyssey/windows-gui/${context.runId}/${process.env.GITHUB_RUN_ATTEMPT}`;
            const trusted = s => s.context === statusContext &&
              s.creator?.login === actor &&
              /^https:\/\/github\.com\/odysseyarm\/odyssey-lab\/actions\/runs\/[1-9][0-9]*$/.test(s.target_url);
            const sample = {context: statusContext, creator: {login: actor},
              target_url: 'https://github.com/odysseyarm/odyssey-lab/actions/runs/1'};
            assert(trusted(sample));
            assert(!trusted({...sample, creator: {login: `${actor}-forged`}}));
            assert(!trusted({...sample, context: `odyssey/windows-gui/${context.runId}/0`}));
            assert(!trusted({...sample, target_url: `${sample.target_url}/other`}));
            const deadline = Date.now() + 38 * 60 * 1000;
            while (Date.now() < deadline) {
              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef,
                {...context.repo, ref: context.sha, per_page: 100});
              const status = statuses.find(trusted);
              if (status?.state === 'success') {
                await core.summary.addLink('Windows GUI screenshots and logs', status.target_url).write();
                return;
              }
              if (status && ['error', 'failure'].includes(status.state)) {
                throw new Error(`Windows GUI failed: ${status.target_url}`);
              }
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('No admitted Windows GUI result. Non-maintainer pushes and scheduled/manual runs need exact-artifact approval in odysseyarm/odyssey-lab.');

  appimage:
    name: Bundle AppImage
    needs: check-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      ODYSSEY_BUILD_VERSION: ${{ needs.check-version.outputs.version }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ODYSSEY_CV_TOKEN }}@github.com/odysseyarm/odyssey-cv.git.insteadOf
      GIT_CONFIG_VALUE_0: ssh://git@github.com/odysseyarm/odyssey-cv.git
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
      - name: Build and verify AppImage
        run: |
          ODYSSEY_BUILD_VERSION="$VERSION" nix build --impure -L .#desktop-appimage .#checks.x86_64-linux.desktop-appimage-contract
          mkdir -p dist
          cp "result/Odyssey-$VERSION-x86_64.AppImage" dist/
      - uses: actions/upload-artifact@v6
        with:
          name: odyssey-desktop-appimage
          path: dist


  nixos-prebuilt:
    name: Build and cache NixOS desktop
    needs: check-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      ODYSSEY_BUILD_VERSION: ${{ needs.check-version.outputs.version }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ODYSSEY_CV_TOKEN }}@github.com/odysseyarm/odyssey-cv.git.insteadOf
      GIT_CONFIG_VALUE_0: ssh://git@github.com/odysseyarm/odyssey-cv.git
      NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
      - name: Build and verify NixOS package
        id: build
        run: |
          set -eu
          test -n "$NIX_SIGNING_KEY" || { echo "NIX_SIGNING_KEY secret is required to publish the NixOS output" >&2; exit 1; }
          out=$(nix build --impure -L --no-link --print-out-paths .#desktop-nixos)
          nix build --impure -L --no-link .#checks.x86_64-linux.desktop-nixos-glibc
          printf '%s\n' "$out" > odyssey-desktop-nixos-store-path.txt
          echo "out=$out" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/push-cache
        with:
          paths: ${{ steps.build.outputs.out }}
          signing-key: ${{ secrets.NIX_SIGNING_KEY }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: actions/upload-artifact@v6
        with:
          name: odyssey-desktop-nixos-store-path
          path: odyssey-desktop-nixos-store-path.txt
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-version, bundle, windows-ui-smoke, appimage, nixos-prebuilt]
    if: github.ref_type == 'tag' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      RELEASE_TYPE: ${{ needs.check-version.outputs.release_type }}
      RELEASE_TAG: ${{ needs.check-version.outputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: odyssey-desktop-msi
      - uses: actions/download-artifact@v6
        with:
          name: odyssey-desktop-appimage
      - uses: actions/download-artifact@v6
        with:
          name: odyssey-desktop-nixos-store-path
      # Re-running a tag replaces the artifacts. The release exists by then, so create
      # it only when it is missing.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$RELEASE_TYPE" = nightly ]; then
              gh release create "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "Odyssey Desktop Nightly $VERSION" \
                --prerelease \
                --notes "Nightly build $VERSION — Windows installers, Linux AppImage, and a NixOS prebuilt package. Full Windows installer includes Orbbec camera software, so installing and calibrating need no internet connection. For computers that must never connect to the internet, install with OFFLINE_MODE=1 (see crates/odyssey-desktop/OFFLINE.md)."
            else
              gh release create "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "Odyssey Desktop v$VERSION" \
                --notes "Odyssey $VERSION — Windows installers, Linux AppImage, and a NixOS prebuilt package. Full Windows installer includes Orbbec camera software, so installing and calibrating need no internet connection. For computers that must never connect to the internet, install with OFFLINE_MODE=1 (see crates/odyssey-desktop/OFFLINE.md)."
            fi
          fi
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --clobber \
            "Odyssey-$VERSION-win-x64.msi" \
            "Odyssey-$VERSION-win-x64-full.msi" \
            "Odyssey-$VERSION-x86_64.AppImage" \
            "odyssey-desktop-nixos-store-path.txt"
  # A release created with GITHUB_TOKEN starts no workflows, so docs-site.yml's
  # `release` trigger never sees this one. Call it directly instead.
  website:
    needs: github-release
    uses: ./.github/workflows/docs-site.yml
    secrets: inherit
