name: Desktop Release

# Build and publish the Windows installer when an odyssey-desktop-vX.Y.Z tag is
# pushed. The tag version must match crates/odyssey-desktop/Cargo.toml.
#
# odyssey-hub-server reaches odyssey-cv over an SSH git URL that this runner
# has no key for, so job-scoped Git config rewrites that URL to an authenticated HTTPS
# one. ODYSSEY_CV_TOKEN is a fine-grained PAT scoped to odysseyarm/odyssey-cv,
# Contents: read.
#
# Run it by hand from the Actions tab (or `gh workflow run`) to test the build
# without a tag: a run from a branch builds and uploads the artifacts but
# publishes nothing.

on:
  push:
    tags:
      - 'odyssey-desktop-v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Check tag matches crate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag version
        id: check
        run: |
          crate_version=$(grep -m1 '^version' crates/odyssey-desktop/Cargo.toml | cut -d'"' -f2)
          # A manual run is from a branch, so there is no tag to compare.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag_version="${GITHUB_REF_NAME#odyssey-desktop-v}"
            if [ "$tag_version" != "$crate_version" ]; then
              echo "Tag version ($tag_version) does not match crates/odyssey-desktop/Cargo.toml version ($crate_version)" >&2
              exit 1
            fi
          fi
          echo "version=$crate_version" >> "$GITHUB_OUTPUT"

  windows-build:
    name: Cross-build Windows executables
    needs: check-version
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ODYSSEY_CV_TOKEN }}@github.com/odysseyarm/odyssey-cv.git.insteadOf
      GIT_CONFIG_VALUE_0: ssh://git@github.com/odysseyarm/odyssey-cv.git
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
        with:
          public-cache: 'true'
      - name: Build both variants and packaging tools
        run: |
          out=$(nix build -L --no-link --print-out-paths .#desktop-windows)
          mkdir prebuilt-windows
          cp -rL "$out"/. prebuilt-windows/
      - uses: actions/upload-artifact@v6
        with:
          name: odyssey-desktop-windows-prebuilt
          path: prebuilt-windows

  bundle:
    name: Bundle MSI
    needs: [check-version, windows-build]
    runs-on: ${{ vars.DESKTOP_RUNNER || 'windows-latest' }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      ODYSSEY_REPO: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: odyssey-desktop-windows-prebuilt
          path: prebuilt-windows
      - name: Bundle the online installer
        shell: bash
        run: ./prebuilt-windows/tools/xtask.exe desktop bundle online --prebuilt prebuilt-windows
      - name: Bundle the full installer
        shell: bash
        run: ./prebuilt-windows/tools/xtask.exe desktop bundle full --prebuilt prebuilt-windows
      - name: Collect the installers
        shell: bash
        run: |
          mkdir dist
          for variant in online full; do
            set -- crates/odyssey-desktop/dist/$variant/*.msi
            if [ ! -f "$1" ]; then echo "cargo-packager produced no $variant msi" >&2; exit 1; fi
            suffix=""; [ "$variant" = full ] && suffix="-full"
            cp "$1" "dist/Odyssey-$VERSION-win-x64$suffix.msi"
          done
          ls -l dist
      - uses: actions/upload-artifact@v6
        with:
          name: odyssey-desktop-msi
          path: dist

  appimage:
    name: Bundle AppImage
    needs: check-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ODYSSEY_CV_TOKEN }}@github.com/odysseyarm/odyssey-cv.git.insteadOf
      GIT_CONFIG_VALUE_0: ssh://git@github.com/odysseyarm/odyssey-cv.git
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
        with:
          public-cache: 'true'
      - name: Build and verify AppImage
        run: |
          nix build -L .#desktop-appimage .#checks.x86_64-linux.desktop-appimage-contract
          mkdir -p dist
          cp "result/Odyssey-$VERSION-x86_64.AppImage" dist/
      - uses: actions/upload-artifact@v6
        with:
          name: odyssey-desktop-appimage
          path: dist


  nixos-prebuilt:
    name: Build and cache NixOS desktop
    needs: check-version
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ODYSSEY_CV_TOKEN }}@github.com/odysseyarm/odyssey-cv.git.insteadOf
      GIT_CONFIG_VALUE_0: ssh://git@github.com/odysseyarm/odyssey-cv.git
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
        with:
          public-cache: 'true'
      - name: Build and verify NixOS package
        id: build
        run: |
          set -eu
          test -n "$CACHIX_AUTH_TOKEN" || { echo "CACHIX_AUTH_TOKEN secret is required to publish the trusted NixOS output" >&2; exit 1; }
          out=$(nix build -L --no-link --print-out-paths .#desktop-nixos)
          nix build -L --no-link .#checks.x86_64-linux.desktop-nixos-glibc
          printf '%s\n' "$out" > odyssey-desktop-nixos-store-path.txt
          echo "out=$out" >> "$GITHUB_OUTPUT"
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: odysseyarm
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pathsToPush: ${{ steps.build.outputs.out }}
      - uses: actions/upload-artifact@v6
        with:
          name: odyssey-desktop-nixos-store-path
          path: odyssey-desktop-nixos-store-path.txt
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-version, bundle, appimage, nixos-prebuilt]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: odyssey-desktop-msi
      - uses: actions/download-artifact@v6
        with:
          name: odyssey-desktop-appimage
      - uses: actions/download-artifact@v6
        with:
          name: odyssey-desktop-nixos-store-path
      # Re-running a tag has to replace the artifacts rather than fail on the
      # release that already exists, so create only when it does not.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Odyssey Desktop v$VERSION" \
              --notes "Odyssey $VERSION — Windows installers, Linux AppImage, and a NixOS prebuilt package. Full Windows installer includes Orbbec camera software, so installing and calibrating need no internet connection. For computers that must never connect to the internet, install with OFFLINE_MODE=1 (see crates/odyssey-desktop/OFFLINE.md)."
          fi
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --clobber \
            "Odyssey-$VERSION-win-x64.msi" \
            "Odyssey-$VERSION-win-x64-full.msi" \
            "Odyssey-$VERSION-x86_64.AppImage" \
            "odyssey-desktop-nixos-store-path.txt"
  # A release created with GITHUB_TOKEN starts no workflows, so docs-site.yml's
  # `release` trigger never sees this one; call it directly instead.
  website:
    needs: github-release
    uses: ./.github/workflows/docs-site.yml
    secrets: inherit
