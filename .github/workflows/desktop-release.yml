name: Desktop Release

# Build and publish the Windows installer when an odyssey-desktop-vX.Y.Z tag is
# pushed. The tag version must match crates/odyssey-desktop/Cargo.toml.
#
# WiX runs on Windows only, so the bundle is built on a windows runner rather
# than cross-compiled the way the FFI libraries are.
#
# odyssey-hub-server reaches odyssey-cv over an SSH git URL that this runner
# has no key for, so job-scoped Git config rewrites that URL to an authenticated HTTPS
# one. ODYSSEY_CV_TOKEN is a fine-grained PAT scoped to odysseyarm/odyssey-cv,
# Contents: read.
#
# Run it by hand from the Actions tab (or `gh workflow run`) to test the build
# without a tag: a run from a branch builds and uploads the artifacts but
# publishes nothing.

on:
  push:
    tags:
      - 'odyssey-desktop-v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Check tag matches crate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag version
        id: check
        run: |
          crate_version=$(grep -m1 '^version' crates/odyssey-desktop/Cargo.toml | cut -d'"' -f2)
          # A manual run is from a branch, so there is no tag to compare.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag_version="${GITHUB_REF_NAME#odyssey-desktop-v}"
            if [ "$tag_version" != "$crate_version" ]; then
              echo "Tag version ($tag_version) does not match crates/odyssey-desktop/Cargo.toml version ($crate_version)" >&2
              exit 1
            fi
          fi
          echo "version=$crate_version" >> "$GITHUB_OUTPUT"

  bundle:
    name: Bundle MSI
    needs: check-version
    # Set the DESKTOP_RUNNER repository variable to a self-hosted Windows
    # runner's label to build there instead. A hosted runner starts empty and
    # compiles all ~670 crates every time, around 20 minutes; a self-hosted one
    # keeps target/ and ~/.cargo between runs and only rebuilds what changed.
    runs-on: ${{ vars.DESKTOP_RUNNER || 'windows-latest' }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      # Do not persist the PAT in a self-hosted runner's global Git config.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ODYSSEY_CV_TOKEN }}@github.com/odysseyarm/odyssey-cv.git.insteadOf
      GIT_CONFIG_VALUE_0: ssh://git@github.com/odysseyarm/odyssey-cv.git
    steps:
      - uses: actions/checkout@v5
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "26.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # A self-hosted runner keeps its own target/, so the cache round-trip is
      # pure overhead there. On a hosted one the shared key keeps a single
      # cache across tags instead of one per build, so only app crates rebuild.
      - uses: Swatinem/rust-cache@v2
        if: ${{ !vars.DESKTOP_RUNNER }}
        with:
          workspaces: ". -> target"
          cache-all-crates: true
          shared-key: desktop-windows
      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      # cargo-packager, at the version pinned in [workspace.metadata.bin] in Cargo.toml.
      - name: Install cargo-packager
        run: cargo bin --install
      # Two installers come from this one job. They are the same app: the full
      # one is built without the `sdk-download` feature and carries Orbbec's camera
      # SDK, for customers who may only run offline software. Neither turns offline
      # mode on unless installed with OFFLINE_MODE=1. Only the app crate
      # is rebuilt for it. `cargo xtask desktop bundle` stages what each variant
      # needs (prepare-orbbec), builds the app and runs cargo-packager with the
      # environment the WiX template reads.
      - name: Bundle the online installer
        shell: bash
        run: cargo xtask desktop bundle online
      - name: Bundle the full installer
        shell: bash
        run: cargo xtask desktop bundle full
      - name: Collect the installers
        shell: bash
        run: |
          mkdir dist
          for variant in online full; do
            set -- crates/odyssey-desktop/dist/$variant/*.msi
            if [ ! -f "$1" ]; then echo "cargo-packager produced no $variant msi" >&2; exit 1; fi
            suffix=""; [ "$variant" = full ] && suffix="-full"
            cp "$1" "dist/Odyssey-$VERSION-win-x64$suffix.msi"
          done
          ls -l dist
      - uses: actions/upload-artifact@v6
        with:
          name: odyssey-desktop-msi
          path: dist

  appimage:
    name: Bundle AppImage
    needs: check-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.ODYSSEY_CV_TOKEN }}@github.com/odysseyarm/odyssey-cv.git.insteadOf
      GIT_CONFIG_VALUE_0: ssh://git@github.com/odysseyarm/odyssey-cv.git
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ clang cmake libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            libvulkan1 libudev-dev libdbus-1-dev pkg-config fuse3 mold
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "26.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The workspace links a GPUI app and a gRPC server, so linking is
      # a real slice of the build; mold cuts it to a fraction of GNU ld.
      - name: Link with mold
        run: echo 'RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> "$GITHUB_ENV"
      # save-if keeps one cache per lockfile rather than one per tag build, so
      # a release that only moves app code reuses the dependency objects.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-all-crates: true
          shared-key: desktop-linux
      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      # cargo-packager, at the version pinned in [workspace.metadata.bin] in Cargo.toml.
      - name: Install cargo-packager
        run: cargo bin --install
      # cargo-packager packages a finished binary; it does not build one.
      - name: Build
        run: cargo build --release --package odyssey-desktop
      # The libraries GPUI loads from the host (Wayland, xkbcommon, Vulkan and
      # the EGL/GL driver stack) are excluded from the image through
      # appimage.excludedLibs in crates/odyssey-desktop/Cargo.toml: a bundled
      # copy shadows the host's and breaks Vulkan against its driver.
      - name: Bundle
        working-directory: crates/odyssey-desktop
        run: cargo bin cargo-packager --release --formats appimage --packages odyssey-desktop --out-dir dist
      # Unpack the image to prove it is well formed and that none of the host
      # libraries slipped in, so a silent packaging change cannot ship an image
      # that dies on a clean machine.
      - name: Collect the AppImage
        run: |
          set -eu
          set -- crates/odyssey-desktop/dist/*.AppImage
          if [ ! -f "$1" ]; then echo "cargo-packager produced no AppImage" >&2; exit 1; fi
          mkdir -p dist
          cp "$1" "dist/Odyssey-$VERSION-x86_64.AppImage"
          chmod +x "dist/Odyssey-$VERSION-x86_64.AppImage"

          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/dist/Odyssey-$VERSION-x86_64.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/odyssey-desktop
          leaked=$(find squashfs-root -name 'libwayland-*' -o -name 'libxkbcommon*' -o -name 'libvulkan*' \
            -o -name 'libEGL*' -o -name 'libGL.so*' -o -name 'libGLX*' -o -name 'libgbm*' -o -name 'libdrm*')
          if [ -n "$leaked" ]; then echo "host libraries bundled:" >&2; echo "$leaked" >&2; exit 1; fi
      - uses: actions/upload-artifact@v6
        with:
          name: odyssey-desktop-appimage
          path: dist

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-version, bundle, appimage]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: odyssey-desktop-msi
      - uses: actions/download-artifact@v6
        with:
          name: odyssey-desktop-appimage
      # Re-running a tag has to replace the artifacts rather than fail on the
      # release that already exists, so create only when it does not.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Odyssey Desktop v$VERSION" \
              --notes "Odyssey $VERSION — Windows installer, Linux AppImage, and a full Windows installer that includes Orbbec's camera software, so installing and calibrating need no internet connection. For computers that must never connect to the internet, install with OFFLINE_MODE=1 (see crates/odyssey-desktop/OFFLINE.md)."
          fi
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --clobber \
            "Odyssey-$VERSION-win-x64.msi" \
            "Odyssey-$VERSION-win-x64-full.msi" \
            "Odyssey-$VERSION-x86_64.AppImage"

  # A release created with GITHUB_TOKEN starts no workflows, so docs-site.yml's
  # `release` trigger never sees this one; call it directly instead.
  website:
    needs: github-release
    uses: ./.github/workflows/docs-site.yml
    secrets: inherit
