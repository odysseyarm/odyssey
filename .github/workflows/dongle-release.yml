name: Dongle Release

# Build and publish the dongle firmware when a dongle-vX.Y.Z tag is pushed. The
# tag version must match firmware/dongle-fw/Cargo.toml.
#
# Three artifacts, because the dongles in the field carry three different
# bootloaders:
#   .hex  Intel HEX for programmers and the bootloaders that take it
#   .uf2  for mass-storage bootloaders, which appear as a drive to copy onto
#   .zip  signed package for serial DFU, which is also what the app updates over
#
# The build runs `just dist` so a release and a local build cannot drift.
#
# Run it by hand from the Actions tab (or `gh workflow run`) to test the build
# without a tag: a run from a branch builds and uploads the artifacts but
# publishes nothing.

on:
  push:
    tags:
      - 'dongle-v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Check tag matches crate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag version
        id: check
        run: |
          crate_version=$(grep -m1 '^version' firmware/dongle-fw/Cargo.toml | cut -d'"' -f2)
          # A manual run is from a branch, so there is no tag to compare.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag_version="${GITHUB_REF_NAME#dongle-v}"
            if [ "$tag_version" != "$crate_version" ]; then
              echo "Tag version ($tag_version) does not match firmware/dongle-fw/Cargo.toml version ($crate_version)" >&2
              exit 1
            fi
          fi
          echo "version=$crate_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build firmware
    needs: check-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the thumbv7em target
        run: |
          rustup target add thumbv7em-none-eabihf
          rustup component add llvm-tools
      # nrf-sdc-sys and nrf-mpsl-sys run bindgen over the SoftDevice headers,
      # which include the CMSIS ones and so need the bare-metal libc headers.
      - name: Install the ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libclang-dev
          arm=/usr/lib/arm-none-eabi
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$arm -I$arm/include" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(ls -d /usr/lib/llvm-*/lib | sort -V | tail -1)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/dongle-fw -> target
          shared-key: dongle-fw
      - uses: extractions/setup-just@v3
      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: Install the build tools
        run: cargo binstall --no-confirm --locked cargo-binutils cargo-hex-to-uf2
      # The signing step wants the legacy nrf5sdk-tools commands, which the
      # standalone nrfutil only exposes through a subcommand; the PyPI build
      # still provides them as `nrfutil pkg generate`.
      - name: Install nrfutil
        run: pipx install nrfutil
      - name: Build the release artifacts
        working-directory: firmware/dongle-fw
        run: just dist
      - name: Check the artifacts carry the tag version
        working-directory: firmware/dongle-fw
        run: |
          set -eu
          for ext in hex uf2 -dfu.zip; do
            test -s "dist/dongle-fw-$VERSION$ext"
          done
          ls -l dist
      - uses: actions/upload-artifact@v6
        with:
          name: dongle-fw
          path: firmware/dongle-fw/dist

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-version, build]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dongle-fw
      # Re-running a tag has to replace the artifacts rather than fail on the
      # release that already exists, so create only when it does not.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Dongle firmware v$VERSION" \
              --notes "Dongle firmware $VERSION. The app updates over serial DFU with the signed zip; the hex and uf2 are for flashing by hand."
          fi
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --clobber \
            "dongle-fw-$VERSION.hex" \
            "dongle-fw-$VERSION.uf2" \
            "dongle-fw-$VERSION-dfu.zip"
