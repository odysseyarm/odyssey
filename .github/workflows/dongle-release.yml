name: Dongle Release

# Build and publish the dongle firmware when a dongle-vX.Y.Z tag is pushed. The
# tag version must match firmware/dongle-fw/Cargo.toml.
#
# Three artifacts, because the dongles in the field carry three different
# bootloaders:
#   .hex  Intel HEX for programmers and the bootloaders that take it
#   .uf2  for mass-storage bootloaders, which appear as a drive to copy onto
#   .zip  signed package for serial DFU, which is also what the app updates over
#
# The build runs `cargo xtask dongle dist` so a release and a local build cannot drift.
#
# Run it by hand from the Actions tab (or `gh workflow run`) to test the build
# without a tag: a run from a branch builds and uploads the artifacts but
# publishes nothing.

on:
  push:
    tags:
      - 'dongle-v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Check tag matches crate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag version
        id: check
        run: |
          crate_version=$(grep -m1 '^version' firmware/dongle-fw/Cargo.toml | cut -d'"' -f2)
          # A manual run is from a branch, so there is no tag to compare.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag_version="${GITHUB_REF_NAME#dongle-v}"
            if [ "$tag_version" != "$crate_version" ]; then
              echo "Tag version ($tag_version) does not match firmware/dongle-fw/Cargo.toml version ($crate_version)" >&2
              exit 1
            fi
          fi
          echo "version=$crate_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build firmware
    needs: check-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
      # The Nix build has no git metadata, so the clean-tree check of
      # `cargo xtask dongle dist` runs here, on the real checkout.
      - name: Check the tree is clean
        run: |
          xtask=$(nix build --no-link --print-out-paths .#xtask)/bin/xtask
          ODYSSEY_REPO="$PWD" "$xtask" dongle check-clean
      # nrfutil with its nrf5sdk-tools extension (1.1.0) comes from the Nix package.
      - name: Build the release artifacts
        run: |
          set -eu
          out=$(nix build -L --no-link --print-out-paths .#dongle-dist)
          mkdir dist
          cp -rL "$out"/. dist/
      - name: Check the artifacts carry the tag version
        run: |
          set -eu
          for ext in .hex .uf2 -dfu-fanstel.zip -dfu-laird.zip; do
            test -s "dist/dongle-fw-$VERSION$ext"
          done
          ls -l dist
      - uses: ./.github/actions/push-cache
        if: github.event_name != 'pull_request'
        with:
          public-builds: '.#dongle-dist .#xtask'
          signing-key: ${{ secrets.NIX_SIGNING_KEY }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: actions/upload-artifact@v6
        with:
          name: dongle-fw
          path: dist

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-version, build]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dongle-fw
      # Re-running a tag has to replace the artifacts rather than fail on the
      # release that already exists, so create only when it does not.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Dongle firmware v$VERSION" \
              --notes "Dongle firmware $VERSION. Update from Devices in Odyssey Desktop 0.7.5 or newer; press the reset/DFU button when prompted. Desktop selects the signed vendor package automatically and checks flash placement before erase. The hex and uf2 are for manual flashing."
          fi
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --clobber \
            "dongle-fw-$VERSION.hex" \
            "dongle-fw-$VERSION.uf2" \
            "dongle-fw-$VERSION-dfu-fanstel.zip" \
            "dongle-fw-$VERSION-dfu-laird.zip"
