name: FFI Build

# Reusable workflow that builds the C/C++ FFI library
# (odyssey-hub-client-ffi) for every platform and bundles CMakeLists.txt, the
# headers and the prebuilt libs for every platform and linkage into one
# self-contained "odyssey-hub-client" zip. That zip is attached to a GitHub
# Release and consumed either directly via CMake FetchContent or through the
# vcpkg port in odysseyarm/vcpkg-registry, whose portfile downloads it and runs
# vcpkg_cmake_configure/install against the embedded CMakeLists.txt.
#
# Called by ffi-ci.yml (PRs / pushes) and ffi-release.yml (tags).
#
# Every library is a Nix derivation (nix/sdk.nix, Crane): linux links against a
# glibc 2.17 baseline through cargo-zigbuild (older than the cross images it
# replaces, so every consumer of the old libs can load these), windows through
# cargo-xwin against a hash-pinned MSVC CRT + Windows SDK, macos natively on a
# darwin builder. The public setup-nix cache is safe here: the SDK lockfiles do
# not resolve the private odyssey-cv dependency, so nothing private is built.
#
# odyssey-hub-client-ffi is its own workspace (excluded from the root one, see
# root Cargo.toml) with its own Cargo.lock. Building it in the root workspace
# would make cargo resolve odyssey-hub-server's odyssey-cv SSH git dependency,
# which CI cannot authenticate to, even though odyssey-hub-client-ffi does not
# depend on it.

on:
  workflow_call:
    inputs:
      version:
        description: SDK version to stamp into the bundled zip's VERSION file; empty = the crate's own VERSION file
        required: false
        type: string
    secrets:
      NIX_SIGNING_KEY:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

jobs:
  # crate-type = ["staticlib", "cdylib"], so one derivation per platform
  # produces both linkages (libs/ holds the final bundle file names) and the
  # cbindgen headers (include/).
  ffi-linux:
    name: FFI linux ${{ matrix.triplet }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            triplet: linux_x64
          - target: aarch64-unknown-linux-gnu
            triplet: linux_arm64
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
      - name: Build (nix, cargo-zigbuild)
        id: build
        run: echo "out=$(nix build -L --no-link --print-out-paths .#sdk-ffi-${{ matrix.triplet }})" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/push-cache
        if: github.event_name != 'pull_request'
        with:
          public-builds: .#sdk-ffi-${{ matrix.triplet }}
          signing-key: ${{ secrets.NIX_SIGNING_KEY }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Collect libs
        run: |
          set -eu
          mkdir -p libs
          cp -L "${{ steps.build.outputs.out }}"/libs/* libs/
          chmod u+w libs/*
          # The headers are identical for every target, so one copy is uploaded.
          if [ "${{ matrix.triplet }}" = linux_x64 ]; then
            mkdir -p headers
            cp -rL "${{ steps.build.outputs.out }}"/include/. headers/
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: ohc-libs-${{ matrix.triplet }}
          path: libs
      - name: Upload headers
        if: matrix.triplet == 'linux_x64'
        uses: actions/upload-artifact@v6
        with:
          name: ohc-headers
          path: headers

  ffi-windows:
    name: FFI windows x64 (cross via xwin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
      # The MSVC CRT and Windows SDK are a hash-pinned fixed-output derivation
      # (nix/xwin.nix); nothing is downloaded by the build itself.
      - name: Build (nix, cargo-xwin)
        id: build
        run: echo "out=$(nix build -L --no-link --print-out-paths .#sdk-ffi-win_x64)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/push-cache
        if: github.event_name != 'pull_request'
        with:
          public-builds: .#sdk-ffi-win_x64
          signing-key: ${{ secrets.NIX_SIGNING_KEY }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Collect libs
        run: |
          set -eu
          mkdir -p libs
          cp -L "${{ steps.build.outputs.out }}"/libs/* libs/
          chmod u+w libs/*
      - uses: actions/upload-artifact@v6
        with:
          name: ohc-libs-win_x64
          path: libs

  ffi-macos:
    name: FFI macos ${{ matrix.triplet }} (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            triplet: macos_x64
          - target: aarch64-apple-darwin
            triplet: macos_arm64
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
      - name: Build (nix)
        id: build
        run: echo "out=$(nix build -L --no-link --print-out-paths .#sdk-ffi-${{ matrix.triplet }})" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/push-cache
        if: github.event_name != 'pull_request'
        with:
          public-builds: .#sdk-ffi-${{ matrix.triplet }}
          signing-key: ${{ secrets.NIX_SIGNING_KEY }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Collect libs
        run: |
          set -eu
          mkdir -p libs
          cp -L "${{ steps.build.outputs.out }}"/libs/* libs/
          chmod u+w libs/*
      - uses: actions/upload-artifact@v6
        with:
          name: ohc-libs-${{ matrix.triplet }}
          path: libs

  bundle:
    name: Bundle SDK zip
    runs-on: ubuntu-latest
    needs: [ffi-linux, ffi-windows, ffi-macos]
    steps:
      - uses: actions/checkout@v5
      - name: Assemble SDK skeleton
        run: |
          set -eu
          out="odyssey-hub-client"
          mkdir -p "$out/include" "$out/lib" "$out/cmake"
          cp sdk/odyssey-hub-client-ffi/CMakeLists.txt "$out/"
          cp sdk/odyssey-hub-client-ffi/Config.cmake.in "$out/"
          cp sdk/odyssey-hub-client-ffi/cmake/DeclareOhcTarget.cmake "$out/cmake/"
          cp LICENSE "$out/"
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(cat sdk/odyssey-hub-client-ffi/VERSION)
          fi
          echo "$version" > "$out/VERSION"
      - uses: actions/download-artifact@v6
        with:
          name: ohc-headers
          path: odyssey-hub-client/include
      - uses: actions/download-artifact@v6
        with:
          pattern: ohc-libs-*
          path: odyssey-hub-client/lib
          merge-multiple: true
      - name: Zip
        run: zip -r odyssey-hub-client.zip odyssey-hub-client
      - uses: actions/upload-artifact@v6
        with:
          name: odyssey-hub-client
          path: odyssey-hub-client.zip
