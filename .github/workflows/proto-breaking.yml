name: Proto Breaking Change Check

# odyssey-hub-server and every client (in-process odyssey-hub-client, the
# uniffi bindings, and the FFI/vcpkg library) talk over the gRPC/protobuf
# service defined in service_interface.proto. Protobuf tolerates clients and
# servers drifting to different versions independently — but only if field
# numbers/types are never reused or changed, and messages are only extended
# additively. This fails PRs that break that contract.
#
# Client and server release independently (uniffi/FFI packages have their
# own tags and version numbers, separate from odyssey-desktop), so unlike
# the uniffi-bindgen-cs<->uniffi build-time ABI (which needs a strict
# version pin because a mismatch is a hard failure), this is a wire-protocol
# compatibility check instead of a version-pin scheme.

on:
  pull_request:
    paths:
      - 'crates/odyssey-hub-server-interface/proto/**'

permissions:
  contents: read

jobs:
  breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-breaking-action@v1
        with:
          input: crates/odyssey-hub-server-interface/proto
          against: 'https://github.com/${{ github.repository }}.git#branch=${{ github.event.pull_request.base.ref }},subdir=crates/odyssey-hub-server-interface/proto'
