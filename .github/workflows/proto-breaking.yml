name: Proto Breaking Change Check

# odyssey-hub-server and every client (in-process odyssey-hub-client, the
# uniffi bindings, the FFI/vcpkg library) talk over the gRPC/protobuf service
# defined in service_interface.proto. Protobuf tolerates clients and servers at
# different versions only if field numbers and types are never reused or
# changed and messages are only extended additively. This fails PRs that break
# that contract.
#
# Client and server release independently: the uniffi/FFI packages have their
# own tags and version numbers, separate from odyssey-desktop. That is why this
# is a wire-compatibility check, not a version pin like the one between
# uniffi-bindgen-cs and uniffi, whose build-time ABI fails hard on a mismatch.

on:
  pull_request:
    paths:
      - 'crates/odyssey-hub-server-interface/proto/**'

permissions:
  contents: read

jobs:
  breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-breaking-action@v1
        with:
          input: crates/odyssey-hub-server-interface/proto
          against: 'https://github.com/${{ github.repository }}.git#branch=${{ github.event.pull_request.base.ref }},subdir=crates/odyssey-hub-server-interface/proto'
