name: Format

# Check every tracked file treefmt.nix formats: Rust, Nix, Python and shell.
# Run `nix fmt` to fix. The job keeps the name `rustfmt` because the master
# ruleset requires that check name.

on:
  push:
    branches:
      - main
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/impact
        id: impact
      - uses: ./.github/actions/setup-nix
        if: steps.impact.outputs.format == 'true'
      - name: Check formatting
        if: steps.impact.outputs.format == 'true'
        run: nix build -L --no-link .#checks.x86_64-linux.format
