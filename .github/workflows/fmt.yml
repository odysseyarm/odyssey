name: Format

# Check Rust formatting for every tracked .rs file: apps, crates, sdk and
# firmware. rustfmt is handed the files directly rather than going through
# cargo fmt, because the sdk and firmware crates are separate workspaces and
# this needs no dependency resolution.

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
      - name: Check formatting
        run: nix build -L --no-link .#checks.x86_64-linux.format
