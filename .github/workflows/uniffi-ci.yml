name: UniFFI CI

# Build + smoke-test uniffi bindgen packages (Python, C#) on every PR and
# push to master. Publishing happens separately in uniffi-release.yml on
# odyssey-hub-client-uniffi-v* tags.

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/uniffi-build.yml
    secrets:
      NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
