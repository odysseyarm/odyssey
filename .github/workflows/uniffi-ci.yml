name: UniFFI CI

# Build + smoke-test uniffi bindgen packages (Python, C#) on pull requests, merge
# groups and pushes to master, skipping them when nothing they build from
# changed. Publishing happens separately in uniffi-release.yml on
# odyssey-hub-client-uniffi-v* tags.

on:
  push:
    branches:
      - main
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      uniffi: ${{ steps.impact.outputs.uniffi }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/impact
        id: impact

  build:
    needs: changes
    if: needs.changes.outputs.uniffi == 'true'
    uses: ./.github/workflows/uniffi-build.yml
    secrets:
      NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  result:
    name: UniFFI CI result
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when the build failed or was cancelled
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.build.result }}
        run: |
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::$RESULTS"; exit 1 ;;
          esac
