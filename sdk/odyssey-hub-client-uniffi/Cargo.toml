[package]
name = "odyssey-hub-client-uniffi"
version = "0.2.1"
edition = "2021"

[workspace]
members = ["uniffi-bindgen"]
# Let `cargo run --bin uniffi-bindgen` resolve from the package root — maturin
# invokes it that way to generate bindings with the exact locked uniffi version.
default-members = [".", "uniffi-bindgen"]

[lib]
crate-type = ["staticlib", "cdylib"]
name = "ohc_uniffi"

[[bin]]
name = "cs_bindgen"
path = "src/bin/cs_bindgen.rs"

[dependencies]
odyssey-hub-common = { path = "../../crates/odyssey-hub-common" }
odyssey-hub-client = { path = "../../crates/odyssey-hub-client" }
odyssey-hub-server-interface = { path = "../../crates/odyssey-hub-server-interface" }
tokio = "1.37.0"
tokio-util = "0.7.10"
tonic = "0.11.0"
nalgebra = "0.34"
odyssey-usb = { path = "../../crates/odyssey-usb" }
paste = "1.0.15"
uniffi = { version = "0.31.0", features = ["tokio"] }
thiserror = "2.0.17"
tokio-stream = "0.1.17"
futures = "0.3.31"
