[package]
name = "odyssey_hub_server_interface"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
repository = "https://github.com/odysseyarm/odyssey-desktop/"
description = "Protobuf interface and From impl's for Odyssey Hub server"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nalgebra = "0.34"
odyssey_hub_common = { path = "../odyssey_hub_common", version = "0.1.0" }
prost = "0.12.4"
tonic = { version = "0.11.0", features = ["prost"] }
ats_usb = { git = "https://github.com/odysseyarm/vmgui", version = "0.1.0" }
postcard = "1"

[build-dependencies]
tonic-build = "0.11.0"
