[package]
name = "odyssey-hub-server"
version = "0.0.0"
edition.workspace = true

[lints]
workspace = true

[features]
sim = ["dep:odyssey-sim", "odyssey-usb/sim", "odyssey-hub-common/sim"]
tracking-regression = ["sim", "dep:odyssey-playback", "dep:minicbor-serde"]

[[bin]]
name = "tracking-regression"
path = "src/bin/tracking-regression.rs"
required-features = ["tracking-regression"]

[dependencies]
ahrs = { workspace = true, features = ["field_access"] }
backon = { workspace = true }
futures = { version = "0.3.30", default-features = false, features = ["alloc", "async-await", "std"] }
futures-concurrency = { workspace = true }
odyssey-hub-server-interface = { workspace = true }
odyssey-hub-common = { workspace = true }
serde = { version = "1.0.197", features = ["derive"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "io-util", "signal"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
tokio-util = { workspace = true }
pin-project = { workspace = true }
odyssey-usb = { workspace = true }
odyssey-sim = { path = "../odyssey-sim", optional = true }
odyssey-playback = { path = "../odyssey-playback", optional = true }
minicbor-serde = { git = "https://github.com/Abrahamh08/minicbor", features = ["std"], optional = true }
nusb = { workspace = true }
odyssey-protocol = { path = "../odyssey-protocol", default-features = false, features = ["std"] }
nalgebra = "0.35"
cam-geom = { workspace = true }
opencv-ros-camera = { git = "https://github.com/Abrahamh08/opencv-ros-camera", branch = "pod-minicbor-repro" }
odyssey-cv = { workspace = true }
odyssey-common = { path = "../odyssey-common" }
socket2 = "0.5.7"
arrayvec = { workspace = true }
serde_json = { workspace = true }
json5 = "0.4.1"
arc-swap = "1.7.1"
interprocess = { workspace = true, features = ["tokio"] }
btleplug = { workspace = true }
uuid = { workspace = true }
heapless = { workspace = true }
dfu-core = { version = "0.8", features = ["std", "async"] }
dfu-nusb = { workspace = true, features = ["tokio"] }
reqwest = { workspace = true, features = ["json"] }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = "2.0"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1.12"

[dev-dependencies]
odyssey-autocalib = { workspace = true }
postcard = { workspace = true, features = ["use-std"] }
