[package]
name = "odyssey-hub-server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
directories = "4.0"
ahrs = { git = "https://github.com/jmagnuson/ahrs-rs", rev = "0b04dfe5e23fd0af9dbea1d24116e4c5b69d3ed9", features = ["field_access"]  }
anyhow = "1.0.81"
futures = { version = "0.3.30", default-features = false, features = ["alloc", "async-await", "std"] }
futures-concurrency = "7.6.1"
odyssey-hub-server-interface = { version = "0.1.0", path = "../odyssey-hub-server-interface" }
odyssey-hub-common = { version = "0.1.0", path = "../odyssey-hub-common" }
serde = { version = "1.0.197", features = ["derive"] }
serialport = { version = "4.2.2", features = ["usbportinfo-interface"] }
serial2 = "0.2.20"
tokio = { version = "1.37.0", features = ["macros", "net", "rt-multi-thread", "io-util", "signal"] }
tokio-stream = { version = "0.1.15", features = ["net"] }
tonic = "0.11.0"
tracing = { version = "0.1.40" }
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "tracing-log"] }
parking_lot = "0.12.1"
tokio-util = "0.7.10"
pin-project = "1.1.5"
odyssey-usb = { path = "../odyssey-usb" }
nusb = "0.2"
odyssey-protocol = { path = "../odyssey-protocol", default-features = false, features = ["std"] }
nalgebra = "0.35"
cam-geom = "0.17"
opencv-ros-camera = { git = "https://github.com/Abrahamh08/opencv-ros-camera", branch = "pod-minicbor-repro" }
odyssey-cv = { git = "ssh://git@github.com/odysseyarm/odyssey-cv.git" }
odyssey-common = { path = "../odyssey-common" }
socket2 = "0.5.7"
arrayvec = "0.7.4"
serde_json = "1.0.128"
sysinfo = "0.32.0"
arc-swap = "1.7.1"
interprocess = { version = "2.2", features = ["tokio"] }
btleplug = "0.11.8"
uuid = "1.17.0"
heapless = "0.9"
dfu-core = { version = "0.8", features = ["std", "async"] }
dfu-nusb = { git = "https://github.com/florg-32/dfu-nusb", branch = "bump-nusb-0.2", features = ["tokio"] }
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1.12"

[dev-dependencies]
odyssey-autocalib = { path = "../odyssey-autocalib" }
