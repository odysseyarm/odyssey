[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
non_kebab_case_packages = "warn"
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
ambiguous_negative_literals = "warn"
elided_lifetimes_in_paths = "warn"
dead_code_pub_in_binary = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
implicit_hasher = "allow"
must_use_candidate = "allow"
use_self = "warn"
unused_trait_names = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_enum_variants_with_brackets = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
too_long_first_doc_paragraph = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
literal_string_with_formatting_args = "allow"
fn_to_numeric_cast_any = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
map_err_ignore = "warn"
if_then_some_else_none = "warn"
get_unwrap = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
rest_pat_in_fully_bound_structs = "warn"


[dependencies]
clap = { version = "4.5", features = ["derive"] }
semver = "1"
odyssey-version = { path = "../odyssey-version" }
odyssey-firmware-manifest = { path = "../odyssey-firmware-manifest" }
eros = "0.8"
hex = "0.4"
memory-spec = "0.3"
pure-release = { git = "https://github.com/Abrahamh08/pure-release" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11"
sha2 = "0.11"
ureq = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
