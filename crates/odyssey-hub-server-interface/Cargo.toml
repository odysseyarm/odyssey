[package]
name = "odyssey-hub-server-interface"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"
repository = "https://github.com/odysseyarm/odyssey"
description = "Protobuf interface and From impl's for Odyssey Hub server"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nalgebra = "0.35"
odyssey-hub-common = { workspace = true }
prost = "0.12.4"
tonic = { workspace = true, features = ["prost"] }
odyssey-usb = { workspace = true }
postcard = { workspace = true }

[build-dependencies]
tonic-build = "0.11.0"
