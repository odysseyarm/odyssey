[package]
name = "odyssey-hub-server-interface"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Protobuf interface and From impl's for Odyssey Hub server"

[lints]
workspace = true

[dependencies]
nalgebra = "0.35"
odyssey-common = { path = "../odyssey-common" }
odyssey-hub-common = { workspace = true }
odyssey-protocol = { path = "../odyssey-protocol", default-features = false, features = ["std"] }
prost = "0.12.4"
tonic = { workspace = true, features = ["prost"] }
odyssey-usb = { workspace = true }
postcard = { workspace = true }

[build-dependencies]
tonic-build = "0.11.0"
