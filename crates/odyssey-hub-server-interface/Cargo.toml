[package]
name = "odyssey-hub-server-interface"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
repository = "https://github.com/odysseyarm/odyssey"
description = "Protobuf interface and From impl's for Odyssey Hub server"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nalgebra = "0.34"
odyssey-hub-common = { path = "../odyssey-hub-common", version = "0.1.0" }
prost = "0.12.4"
tonic = { version = "0.11.0", features = ["prost"] }
odyssey-usb = { path = "../odyssey-usb" }
postcard = "1"

[build-dependencies]
tonic-build = "0.11.0"
