syntax = "proto3";

package odyssey.service_interface;

service Service {
  rpc GetDeviceList(DeviceListRequest) returns (DeviceListReply) {}
  rpc SubscribeDeviceList(SubscribeDeviceListRequest) returns (stream DeviceListReply) {}

  rpc GetAccessoryMap(AccessoryMapRequest) returns (AccessoryMapReply) {}
  rpc SubscribeAccessoryMap(SubscribeAccessoryMapRequest) returns (stream AccessoryMapReply) {}
  rpc UpdateAccessoryInfoMap(AccessoryInfoMap) returns (EmptyReply) {}

  rpc GetScreenInfoById(ScreenInfoByIdRequest) returns (ScreenInfoReply) {}

  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream Event) {}

  rpc WriteVendor(WriteVendorRequest) returns (EmptyReply) {}
  rpc ReadRegister(ReadRegisterRequest) returns (ReadRegisterReply) {}
  rpc WriteRegister(WriteRegisterRequest) returns (EmptyReply) {}
  rpc ReadConfig(ReadConfigRequest) returns (ReadConfigReply) {}
  rpc WriteConfig(WriteConfigRequest) returns (EmptyReply) {}
  rpc FlashSettings(FlashSettingsRequest) returns (EmptyReply) {}
  rpc ClearZero(Device) returns (EmptyReply) {}
  rpc ResetZero(Device) returns (EmptyReply) {}
  rpc SaveZero(Device) returns (EmptyReply) {}
  rpc Zero(ZeroRequest) returns (EmptyReply) {}

  rpc ResetShotDelay(Device) returns (ResetShotDelayReply) {}
  rpc GetShotDelay(Device) returns (GetShotDelayReply) {}
  rpc SetShotDelay(SetShotDelayRequest) returns (EmptyReply) {}
  rpc SaveShotDelay(Device) returns (EmptyReply) {}
  rpc SubscribeShotDelay(SubscribeShotDelayRequest) returns (stream GetShotDelayReply) {}

  // Pairing and bonding of ATS devices.
  rpc StartPairing(StartPairingRequest) returns (EmptyReply) {}
  rpc CancelPairing(CancelPairingRequest) returns (EmptyReply) {}
  rpc ClearBond(ClearBondRequest) returns (EmptyReply) {}
  rpc SetTransportMode(SetTransportModeRequest) returns (TransportModeReply) {}

  rpc SubscribeDongleList(SubscribeDongleListRequest) returns (stream DongleListReply) {}
  rpc StartDonglePairing(StartDonglePairingRequest) returns (EmptyReply) {}
  rpc CancelDonglePairing(CancelDonglePairingRequest) returns (EmptyReply) {}
  rpc ClearDongleBonds(ClearDongleBondsRequest) returns (EmptyReply) {}
  rpc SetDeviceName(SetDeviceNameRequest) returns (EmptyReply) {}

  rpc BringToFront(EmptyRequest) returns (EmptyReply) {}
}

message Matrix3x3 {
  float m11 = 1;
  float m12 = 2;
  float m13 = 3;
  float m21 = 4;
  float m22 = 5;
  float m23 = 6;
  float m31 = 7;
  float m32 = 8;
  float m33 = 9;
}

message Matrix3x1 {
  float m11 = 1;
  float m21 = 2;
  float m31 = 3;
}
message Vector2 {
  float x = 1;
  float y = 2;
}
message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Pose {
  Matrix3x3 rotation = 1;
  Matrix3x1 translation = 2;
}

enum Transport {
  USB = 0;
  USBMux = 1;
  UDPMux = 2;
}

enum EventsTransport {
  WIRED = 0; // Events arrive over USB.
  BLUETOOTH = 1; // Events arrive over BLE.
}

message Device {
  bytes uuid = 1;
  Transport transport = 2;
  FirmwareVersion firmware_version = 3; // May be unset; check presence before use.
  uint32 capabilities = 4; // Bitfield: 0x01 = CONTROL, 0x02 = EVENTS
  EventsTransport events_transport = 5;
  bool events_connected = 6; // True while events are arriving.
  uint32 product_id = 7; // USB PID (0x520F=AtsVm, 0x5210=AtsLite, 0x5211=Lite1, 0x5212=Mux), 0=unknown
  string name = 8; // BLE bond name, USB product string, or a name the user set.
  uint32 netcore_release = 9; // nRF5340 net core release counter, 0=unknown or not reported
}

message FirmwareVersion {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

message DeviceEvent {
  Device device = 1;

  message AccelerometerEvent {
    uint32 timestamp = 1;
    Vector3 acceleration = 2;
    Vector3 angular_velocity = 3;
    Vector3 euler_angles = 4;
  }

  message TrackingEvent {
    uint32 timestamp = 1;
    Vector2 aimpoint = 2;
    Pose pose = 3;
    float distance = 4;
    uint32 screen_id = 5;
  }

  message ImpactEvent {
    uint32 timestamp = 1;
  }

  message PacketEvent {
    bytes bytes = 1;
  }

  message ZeroResultEvent {
    bool success = 1;
  }
  message SaveZeroResultEvent {
    bool success = 1;
  }

  message CapabilitiesChangedEvent {
    // The changed capabilities are in `DeviceEvent.device`.
  }

  message PairingResultEvent {
    bool success = 1;
    bytes paired_address = 2; // 6-byte BLE address on success
    string error = 3; // Error or status text.
    string paired_name = 4; // BLE device name on success
  }

  message BatteryEvent {
    uint32 percent = 1;
    bool charging = 2;
  }

  oneof device_event_oneof {
    AccelerometerEvent accelerometer = 2;
    TrackingEvent tracking = 3;
    ImpactEvent impact = 4;
    PacketEvent packet = 7;
    ZeroResultEvent zero_result = 8;
    SaveZeroResultEvent save_zero_result = 9;
    CapabilitiesChangedEvent capabilities_changed = 10;
    PairingResultEvent pairing_result = 11;
    BatteryEvent battery = 12;
  }
}

message DonglePairingResultEvent {
  string dongle_id = 1;
  bool success = 2;
  bytes paired_address = 3; // 6-byte BLE address on success
  string error = 4; // Error or status text.
  string paired_name = 5; // BLE device name on success
}

message Event {
  oneof event_oneof {
    DeviceEvent device = 1;
    DonglePairingResultEvent dongle_pairing_result = 2;
  }
}

message DeviceListRequest {}
message SubscribeDeviceListRequest {}
message DeviceListReply {
  repeated Device device_list = 1;
}

enum AccessoryType {
  DRY_FIRE_MAG = 0;
  MANTIS_X = 1;
}
enum AccessoryFeature {
  IMPACT = 0;
}

message AccessoryInfo {
  string name = 1;
  AccessoryType ty = 2;
  uint64 assignment = 3; // 0 = unassigned.
  repeated AccessoryFeature features = 4;
}

message AccessoryStatus {
  AccessoryInfo accessory = 1;
  bool connected = 2;
}

message AccessoryMapRequest {}
message SubscribeAccessoryMapRequest {}
message AccessoryMapReply {
  map<uint64, AccessoryStatus> accessory_map = 1;
}
message AccessoryInfoMap {
  map<uint64, AccessoryInfo> accessory_info_map = 1;
}

message SubscribeShotDelayRequest {
  Device device = 1;
}
message ResetShotDelayReply {
  uint32 delay_ms = 1;
}
message GetShotDelayReply {
  uint32 delay_ms = 1;
}
message SetShotDelayRequest {
  Device device = 1;
  uint32 delay_ms = 2;
}

message ScreenBounds {
  Vector2 tl = 1;
  Vector2 tr = 2;
  Vector2 bl = 4;
  Vector2 br = 3;
}

message ScreenInfoByIdRequest {
  uint32 id = 1;
}
message ScreenInfoReply {
  uint32 id = 1;
  ScreenBounds bounds = 2;
}

message WriteVendorRequest {
  Device device = 1;
  uint32 tag = 2;
  bytes data = 3;
}

message ZeroRequest {
  Device device = 1;
  Vector3 translation = 2;
  Vector2 target = 3;
  DeviceEvent.TrackingEvent tracking_event = 4;
}

message ReadRegisterRequest {
  Device device = 1;
  uint32 port = 2; // 0=Nf, 1=Wf
  uint32 bank = 3;
  uint32 address = 4;
}
message ReadRegisterReply {
  uint32 data = 1;
}
message WriteRegisterRequest {
  Device device = 1;
  uint32 port = 2;
  uint32 bank = 3;
  uint32 address = 4;
  uint32 data = 5;
}
message ReadConfigRequest {
  Device device = 1;
  uint32 kind = 2; // 0=ImpactThreshold, 1=SuppressMs
}
message ReadConfigReply {
  uint32 value = 1;
}
message WriteConfigRequest {
  Device device = 1;
  uint32 kind = 2;
  uint32 value = 3;
}
message FlashSettingsRequest {
  Device device = 1;
}

message StartPairingRequest {
  Device device = 1;
  uint32 timeout_ms = 2;
}
message CancelPairingRequest {
  Device device = 1;
}
message ClearBondRequest {
  Device device = 1;
}
message SetTransportModeRequest {
  Device device = 1;
  bool usb_mode = 2; // true = USB, false = BLE
}
message TransportModeReply {
  bool usb_mode = 1; // Mode the device confirmed.
}

message Dongle {
  string id = 1; // USB serial number or unique identifier
  FirmwareVersion firmware_version = 2;
  repeated bytes connected_devices = 3; // BLE addresses of connected devices
  FirmwareVersion protocol_version = 4; // Mux endpoint protocol version, despite the generic name.
  repeated bytes bonded_devices = 5; // BLE addresses of bonded devices
  FirmwareVersion control_protocol_version = 6; // dongle control endpoint protocol version
}

message SubscribeDongleListRequest {}
message DongleListReply {
  repeated Dongle dongle_list = 1;
}

message StartDonglePairingRequest {
  string dongle_id = 1;
  uint32 timeout_ms = 2;
}
message CancelDonglePairingRequest {
  string dongle_id = 1;
}
message ClearDongleBondsRequest {
  string dongle_id = 1;
}
message SetDeviceNameRequest {
  Device device = 1;
  string name = 2;
}

message SubscribeEventsRequest {}
message EmptyRequest {}
message EmptyReply {}
