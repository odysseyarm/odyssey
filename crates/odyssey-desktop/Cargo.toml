[package]
name = "odyssey-desktop"
version = "0.7.5"
edition.workspace = true
default-run = "odyssey-desktop"

[lints]
workspace = true

[dependencies]
eros = { workspace = true }
semver = "1"
backon = { workspace = true }
futures = { version = "0.3.30", default-features = false, features = ["std", "async-await"] }
futures-concurrency = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
odyssey-usb = { workspace = true }
odyssey-protocol = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing = { workspace = true }
gpui = { package = "gpui-kit", version = "0.9.0" }
odyssey-autocalib = { workspace = true }
odyssey-common = { path = "../odyssey-common" }
odyssey-hub-client = { workspace = true }
odyssey-hub-common = { workspace = true }
odyssey-hub-server = { workspace = true }
odyssey-sim = { path = "../odyssey-sim", optional = true }
tokio-util = { workspace = true }
image = "0.25.6"
hex = { workspace = true }
nalgebra = "0.35"
dfu-nusb = { workspace = true }
nusb = { workspace = true }
parking_lot = { workspace = true }
# The native Save As dialog for the scale board PDFs.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { workspace = true }
# The online build's SDK downloader (see the sdk-download feature).
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
default = ["sdk-download"]
# Lets the app download the Orbbec camera SDK itself. The full installer is built
# without it (--no-default-features): it carries the SDK instead and never opens a
# network connection for it, for customers who may only run offline software.
sdk-download = ["dep:reqwest", "dep:sha2"]
sim = ["odyssey-hub-server/sim", "dep:odyssey-sim"]

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.21", default-features = false }

# Puts the icon into the .exe, which Explorer, the taskbar and the shortcuts read.
# Unconditional: a build script's `cfg(windows)` is the host, and Linux cross-builds the exe.
[build-dependencies]
embed-resource = "3"

[[bin]]
name = "odyssey-sim-control"
path = "src/bin/odyssey-sim-control.rs"
required-features = ["sim"]

# Installer config for cargo-packager (`cargo bin cargo-packager`; see
# crates/xtask/src/desktop.rs and .github/workflows/desktop-release.yml).
[package.metadata.packager]
productName = "Odyssey"
identifier = "com.odysseyarm.odyssey"
publisher = "OdysseyArm"
description = "Odyssey PC application"
icons = ["icons/icon.ico", "icons/icon.png"]
# Not the sim-control helper bin.
binaries = [{ path = "odyssey-desktop", main = true }]

# The installer is built in two variants from one tree (see wix/main.wxs and
# crates/xtask/src/desktop/orbbec.rs): online carries no camera SDK and the app
# downloads it. Full carries it as an optional feature. The fragment below is
# generated per variant by `cargo xtask desktop bundle online|full`, which also
# sets the environment the template reads. The upgrade code lives in the template.
[package.metadata.packager.wix]
template = "wix/main.wxs"
fragmentPaths = ["target/orbbec-stage/orbbec.wxs"]
featureRefs = ["OrbbecSdk"]

# GPUI dlopens the Wayland, xkbcommon and Vulkan libraries and the driver stack
# behind them, so they must come from the host: bundled copies would shadow the
# host's and break Vulkan/EGL on newer Mesa.
[package.metadata.packager.appimage]
excludedLibs = [
    "libwayland-client*", "libwayland-cursor*", "libwayland-egl*", "libwayland-server*",
    "libxkbcommon*", "libvulkan*", "libEGL*", "libGL.so*", "libGLX*", "libGLdispatch*",
    "libgbm*", "libdrm*", "libglapi*",
]
