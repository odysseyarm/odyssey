[package]
name = "odyssey-hub-client"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"
repository = "https://github.com/odysseyarm/odyssey"
description = "Client library for Odyssey Desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { workspace = true }
odyssey-hub-server-interface = { workspace = true }
odyssey-hub-common = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "signal", "rt-multi-thread"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tower = "0.4.13"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = "2.0.17"
interprocess = { workspace = true, features = ["tokio"] }
futures = "0.3.31"
