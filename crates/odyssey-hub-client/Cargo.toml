[package]
name = "odyssey-hub-client"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Client library for Odyssey Desktop"

[lints]
workspace = true

[dependencies]
eros = { workspace = true }
odyssey-hub-server-interface = { workspace = true }
odyssey-hub-common = { workspace = true }
odyssey-protocol = { path = "../odyssey-protocol", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["macros", "net", "signal", "rt-multi-thread", "time"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tower = "0.4.13"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = "2.0.17"
interprocess = { workspace = true, features = ["tokio"] }
futures = "0.3.31"
