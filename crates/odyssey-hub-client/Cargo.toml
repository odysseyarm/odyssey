[package]
name = "odyssey-hub-client"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"
repository = "https://github.com/odysseyarm/odyssey"
description = "Client library for Odyssey Desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.81"
odyssey-hub-server-interface = { path = "../odyssey-hub-server-interface", version = "0.1.0" }
odyssey-hub-common = { path = "../odyssey-hub-common", version = "0.1.0" }
tokio = { version = "1.37.0", features = ["macros", "net", "signal", "rt-multi-thread"] }
tokio-util = { version = "0.7.10" }
tonic = "0.11.0"
tower = "0.4.13"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
thiserror = "2.0.17"
interprocess = { version = "2.2", features = ["tokio"] }
futures = "0.3.31"
