[package]
name = "odyssey-hub"
version = "0.0.0"
edition.workspace = true

[lints]
workspace = true

[features]
sim = ["odyssey-hub-server/sim"]

[dependencies]
eros = { workspace = true }
futures = { version = "0.3.30", default-features = false, features = ["alloc", "async-await", "std"] }
futures-concurrency = { workspace = true }
odyssey-hub-client = { workspace = true }
odyssey-hub-server = { workspace = true }
odyssey-hub-server-interface = { workspace = true }
serde = { version = "1.0.197", features = ["derive"] }
tokio = { workspace = true, features = ["macros", "net"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

