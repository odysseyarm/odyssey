[package]
name = "odyssey-protocol"
version = "0.2.0"
edition = "2024"

[dependencies]
pyo3 = { version = "0.27.1", optional = true }
odyssey-common = { path = "../odyssey-common", default-features = false }
odyssey-protocol-macros = { path = "../odyssey-protocol-macros" }
enumn = "0.1.14"
nalgebra = { version = "0.35", default-features = false }
serde = { version = "1.0.219", default-features = false, optional = true }
opencv-ros-camera = { git = "https://github.com/Abrahamh08/opencv-ros-camera", branch = "pod-minicbor-repro", default-features = false }
thiserror = { version = "2.0.17", default-features = false }
defmt = { version = "1.0.1", optional = true }
static_assertions = "1.1.0"
serde_bytes = { version = "0.11.19", optional = true, default-features = false }
heapless = "0.9.2"
minicbor = { git = "https://github.com/Abrahamh08/minicbor", features = ["derive"], optional = true }
minicbor-serde = { git = "https://github.com/Abrahamh08/minicbor", optional = true }
bitbybit = "1.3.3"
arbitrary-int = "1.3.0"

[features]
default = ["std"]
std = ["nalgebra/std", "odyssey-common/std"]
pyo3 = ["dep:pyo3", "std"]
serde = [
    "dep:serde",
    "dep:serde_bytes",
    "heapless/serde",
    "nalgebra/serde-serialize-no-std",
    "opencv-ros-camera/serde-pod",
]
serde-no-std = ["serde"]
serde-std = ["serde", "nalgebra/serde-serialize"]
minicbor = ["dep:minicbor", "dep:minicbor-serde", "serde"]
defmt = ["dep:defmt", "nalgebra/defmt", "heapless/defmt"]
