[package]
name = "odyssey-autocalib"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/odysseyarm/odyssey"
license = "MIT OR Apache-2.0"
description = "Automatic screen calibration from a depth camera, in pure Rust"

[dependencies]
nalgebra = { version = "0.35", features = ["serde-serialize"] }
odyssey-common = { path = "../odyssey-common", features = ["serde_json"] }
image = { version = "0.25", default-features = false }
thiserror = "2"
tracing = { workspace = true }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
# Loads the Orbbec SDK shared library at run time; nothing links against it.
libloading = "0.8"
parking_lot = { workspace = true }

[dev-dependencies]
tempfile = "3"

# Reads a monitor's EDID from the registry; nothing else here is Windows-specific.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry"] }
