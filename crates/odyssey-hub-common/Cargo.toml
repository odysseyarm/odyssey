[package]
name = "odyssey-hub-common"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"
repository = "https://github.com/odysseyarm/odyssey"
description = "Odyssey Hub common structures and impls"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arrayvec = { workspace = true }
odyssey-common = { path = "../odyssey-common" }
odyssey-usb = { workspace = true }
nalgebra = "0.35"
app_dirs2 = { workspace = true }
serde = "1.0.197"
serde_json = { workspace = true }
tracing = { workspace = true }
json5 = "0.4.1"
tokio = { workspace = true, features = ["fs"] }
fixed_str = "0.9"
uniffi = "0.31.0"

[dev-dependencies]
tokio = { workspace = true, features = ["rt"] }
