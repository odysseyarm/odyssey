[package]
name = "odyssey-hub-common"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
repository = "https://github.com/odysseyarm/odyssey"
description = "Odyssey Hub common structures and impls"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arrayvec = "0.7.4"
odyssey-common = { path = "../odyssey-common" }
odyssey-usb = { path = "../odyssey-usb" }
nalgebra = "0.35"
app_dirs2 = "2.5.5"
serde = "1.0.197"
serde_json = "1.0.128"
tracing = "0.1.41"
json5 = "0.4.1"
tokio = { version = "1.48.0", features = ["fs"] }
fixed_str = "0.9"
uniffi = "0.31.0"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["rt"] }
