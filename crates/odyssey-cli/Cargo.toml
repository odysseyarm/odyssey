[package]
name = "odyssey-cli"
version = "0.0.0"
edition.workspace = true

[lints]
workspace = true

[[bin]]
name = "odyssey-cli"
path = "src/main.rs"

[dependencies]
argmin = { workspace = true }
argmin-math = { workspace = true, features = ["vec"] }
odyssey-usb = { workspace = true }
odyssey-hub-client = { workspace = true }
odyssey-hub-common = { workspace = true }
odyssey-protocol = { path = "../odyssey-protocol" }
clap = { workspace = true, features = ["derive"] }
futures = "0.3.30"
nalgebra = "0.35"
nusb = { workspace = true }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal", "io-std", "io-util", "macros", "rt-multi-thread"] }
eros = { workspace = true }
rand = "0.8"
