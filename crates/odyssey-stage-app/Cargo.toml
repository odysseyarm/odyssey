[package]
name = "odyssey-stage-app"
version = "0.0.0"
edition.workspace = true

[lints]
workspace = true

[[bin]]
name = "odyssey-stage"
path = "src/main.rs"

[dependencies]
odyssey-stage = { path = "../odyssey-stage" }
odyssey-sim = { path = "../odyssey-sim" }
odyssey-hub-server = { workspace = true, features = ["sim", "tracking-regression"] }
odyssey-hub-client = { workspace = true }
odyssey-hub-common = { workspace = true }
axum = { version = "0.6", default-features = false, features = ["tokio", "http1", "json", "query"] }
clap = { workspace = true, features = ["derive"] }
eros = { workspace = true }
futures = "0.3.30"
hex = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
tokio-stream = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
