[package]
name = "odyssey-usb"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { workspace = true }
argmin = { workspace = true }
odyssey-common = { path = "../odyssey-common", features = ["std"] }
enumn = { workspace = true }
nalgebra = "0.35"
opencv-ros-camera = { git = "https://github.com/Abrahamh08/opencv-ros-camera", branch = "pod-minicbor-repro", features = ["serde-serialize"] }
serde = "1.0.204"
serde_json = { workspace = true }
socket2 = "0.6.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "rt", "sync", "time", "net", "io-util"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
odyssey-protocol = { path = "../odyssey-protocol", features = ["std", "serde-std", "minicbor"] }
num-traits = { workspace = true }
num-derive = { workspace = true }
nusb = { workspace = true, features = ["tokio"] }
postcard = { workspace = true, features = ["use-std"] }
minicbor = { workspace = true }
heapless = { workspace = true }
futures = "0.3.31"
rand = "0.8"
parking_lot = { workspace = true }

[features]
pyo3 = ["odyssey-protocol/pyo3"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
