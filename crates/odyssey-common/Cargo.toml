[package]
name = "odyssey-common"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/odysseyarm/odyssey"
license = "MIT OR Apache-2.0"
description = "Common structures for Odyssey ATS tracking"

[features]
default = ["std"]
std = ["serde", "serde_json", "simba/std"]
serde_json = ["dep:serde_json", "serde"]
serde = ["dep:serde", "nalgebra/serde-serialize"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nalgebra = { version = "0.35", default-features = false, features = [ "libm", "macros" ] }
num = { version = "0.4.1", default-features = false, features = [ "libm" ] }
opencv-ros-camera = { git = "https://github.com/Abrahamh08/opencv-ros-camera", branch = "pod-minicbor-repro", default-features = false }
serde = { version = "1.0.198", features = [ "derive" ], optional = true }
serde_json = { workspace = true, optional = true }
simba = { version = "0.10", default-features = false }
