[package]
name = "odyssey-hub"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { workspace = true }
futures = { version = "0.3.30", default-features = false, features = ["alloc", "async-await", "std"] }
futures-concurrency = { workspace = true }
odyssey-hub-client = { workspace = true }
odyssey-hub-server = { workspace = true }
odyssey-hub-server-interface = { workspace = true }
serde = { version = "1.0.197", features = ["derive"] }
tokio = { workspace = true, features = ["macros", "net"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dependencies.interprocess]
git = "https://github.com/kotauskas/interprocess.git"
rev = "ffbf7c65911c87251c47a8403da9b91118eb259c"
features = ["tokio"]
