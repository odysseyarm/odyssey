[package]
name = "odyssey-desktop"
version = "0.6.4"
edition = "2021"
default-run = "odyssey-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["orbbec"]
# Orbbec depth cameras for automatic screen calibration. The SDK builds from
# source with CMake and loads as a shared library at runtime, so builds that
# cannot ship it turn this off. The calibration wizard then runs only against
# its demo camera and lists no hardware.
#
# Runtime requirement: `libOrbbecSDK.so` (`OrbbecSDK.dll` on Windows) and its
# `extensions/` directory must sit next to the executable. orbbec-sdk-sys
# leaves both in its build directory and sets no rpath; build.rs makes
# development builds (`cargo run`, `cargo test`, `dx serve`) find them there.
# Packaging a release (MSI, AppImage, Nix) must still install both beside the
# executable, which nothing in this repository does yet.
#
# `dep:orbbec-sdk-sys` is not used by this crate's code. It makes the SDK a
# direct dependency, which is what makes cargo run the SDK's build script
# before this crate's, so build.rs can find the library it built.
orbbec = ["odyssey-autocalib/orbbec", "dep:orbbec-sdk-sys"]

[dependencies]
anyhow = "1"
futures = { version = "0.3.30", default-features = false, features = ["std", "async-await"] }
futures-concurrency = "7.6.1"
serialport = { version = "4.2.2", features = ["usbportinfo-interface"] }
serial2 = "0.2.20"
tokio = { version = "1.37.0", features = ["macros", "net", "rt", "sync", "time"] }
odyssey-usb = { path = "../../crates/odyssey-usb" }
tracing-subscriber = "0.3.19"
dioxus = { version = "0.7.10", features = ["desktop", "signals"] }
dioxus-router = "0.7.10"
odyssey-autocalib = { path = "../../crates/odyssey-autocalib" }
odyssey-common = { path = "../../crates/odyssey-common" }
odyssey-hub-client = { path = "../../crates/odyssey-hub-client" }
odyssey-hub-common = { path = "../../crates/odyssey-hub-common" }
odyssey-hub-server = { version = "0.1.0", path = "../../crates/odyssey-hub-server" }
slab = "0.4.9"
tokio-util = "0.7.15"
image = "0.25.6"
base64 = "0.22"
hex = "0.4.3"
nalgebra = "0.35"
btleplug = "0.11.8"
uuid = "1.18.0"
dfu-nusb = { git = "https://github.com/florg-32/dfu-nusb", branch = "bump-nusb-0.2" }
parking_lot = "0.12"
orbbec-sdk-sys = { version = "0.3.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"
