[package]
name = "odyssey-desktop"
version = "0.6.7"
edition = "2024"
default-run = "odyssey-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { workspace = true }
futures = { version = "0.3.30", default-features = false, features = ["std", "async-await"] }
futures-concurrency = { workspace = true }
serialport = { workspace = true, features = ["usbportinfo-interface"] }
serial2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
odyssey-usb = { workspace = true }
tracing-subscriber = { workspace = true }
dioxus = { version = "0.7.10", features = ["desktop", "signals"] }
dioxus-router = "0.7.10"
odyssey-autocalib = { workspace = true }
odyssey-common = { path = "../../crates/odyssey-common" }
odyssey-hub-client = { workspace = true }
odyssey-hub-common = { workspace = true }
odyssey-hub-server = { workspace = true }
slab = "0.4.9"
tokio-util = { workspace = true }
image = "0.25.6"
base64 = "0.22"
hex = { workspace = true }
nalgebra = "0.35"
btleplug = { workspace = true }
uuid = { workspace = true }
dfu-nusb = { workspace = true }
parking_lot = { workspace = true }
# The native Save As dialog for the scale board PDFs. Already in the build through
# dioxus-desktop with exactly these features, so this adds no code.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { workspace = true }
# The online build's SDK downloader (see the sdk-download feature).
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
default = ["sdk-download"]
# Lets the app download the Orbbec camera SDK itself. The offline installer is built
# without it (--no-default-features): it carries the SDK instead and never opens a
# network connection for it, for customers who may only run offline software.
sdk-download = ["dep:reqwest", "dep:sha2"]

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"
