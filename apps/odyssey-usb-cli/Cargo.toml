[package]
name = "odyssey-usb-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
argmin = "0.11"
argmin-math = { version = "0.5", features = ["vec"] }
argmin-observer-slog = "0.2"
odyssey-usb = { path = "../../crates/odyssey-usb" }
clap = { version = "4.5.11", features = ["derive"] }
executors = "0.9.0"
futures = "0.3.30"
nalgebra = "0.35"
nusb = "0.2.1"
serde = "1.0.204"
serde_json = "1.0.121"
serialport = { version = "4.3.0", features = ["usbportinfo-interface"] }
tokio = { version = "1.38.0", features = ["signal", "io-std", "io-util"] }
