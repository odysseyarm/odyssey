[package]
name = "odyssey-usb-cli"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
argmin = { workspace = true }
argmin-math = { workspace = true, features = ["vec"] }
argmin-observer-slog = "0.2"
odyssey-usb = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = "0.3.30"
nalgebra = "0.35"
nusb = { workspace = true }
serde = "1.0.204"
serde_json = { workspace = true }
serialport = { workspace = true, features = ["usbportinfo-interface"] }
tokio = { workspace = true, features = ["signal", "io-std", "io-util"] }
