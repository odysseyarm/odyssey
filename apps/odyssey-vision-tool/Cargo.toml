[package]
name = "odyssey-vision-tool"
version = "0.1.0"
edition = "2024"
default-run = "odyssey-vision-tool"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
bevy = ["dep:bevy", "dep:bevy_infinite_grid", "dep:bevy_atmosphere"]

[dependencies]
ahrs = { git = "https://github.com/jmagnuson/ahrs-rs", rev = "0b04dfe5e23fd0af9dbea1d24116e4c5b69d3ed9", features = ["field_access"]  }
anyhow = "1.0.75"
arrayvec = "0.7.4"
crossbeam = "0.8.4"
csv = "1.3.0"
iui = { path = "../../third_party/libui-rs/iui", features = ["plotters"] }
ui-sys = { path = "../../third_party/libui-rs/ui-sys" }
leptos_reactive = {  version = "0.6.4", features = ["serde"] }
nalgebra = { version = "0.35", features = ["serde-serialize"] }
serde = "1.0.193"
tokio = { version = "1.32.0", features = ["macros", "rt-multi-thread", "rt", "sync", "time"] }
odyssey-cv = { git = "ssh://git@github.com/odysseyarm/odyssey-cv.git", features = ["telemetry"] }
odyssey-common = { path = "../../crates/odyssey-common", features = ["std"] }
odyssey-playback = { path = "../../crates/odyssey-playback" }
odyssey-usb = { path = "../../crates/odyssey-usb" }
odyssey-protocol = { path = "../../crates/odyssey-protocol" }
tokio-stream = "0.1.14"
pin-project = "1.1.4"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
enumn = "0.1.13"
parking_lot = "0.12.1"
opencv-ros-camera = { git = "https://github.com/Abrahamh08/opencv-ros-camera", branch = "pod-minicbor-repro" }
cam-geom = { version = "0.17" }
socket2 = "0.6.0"
plotters = { version = "0.3.6", default-features = false, features = ["line_series", "point_series", "surface_series", "colormaps", "full_palette"] }
app_dirs2 = "2.5.5"
serde_json = "1.0.120"
bevy = { version = "0.17.2", optional = true }
bevy_infinite_grid = { git = "https://github.com/XYCaptain/bevy_infinite_grid.git", branch = "main", optional = true }
bevy_atmosphere = { version = "0.13.0", optional = true }
num-traits = "0.2.19"
num-derive = "0.4.2"
cobs = "0.4.0"
nusb = { version = "0.2.1", features = ["tokio"] }
postcard = { version = "1.1.3", features = ["use-std"] }

# For mux-cli
clap = { version = "4", features = ["derive"] }
