[package]
name = "odyssey-vision-tool"
version = "0.1.0"
edition = "2024"
default-run = "odyssey-vision-tool"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
bevy = ["dep:bevy", "dep:bevy_infinite_grid", "dep:bevy_atmosphere"]

[dependencies]
ahrs = { workspace = true, features = ["field_access"] }
anyhow = { workspace = true }
arrayvec = { workspace = true }
crossbeam = "0.8.4"
csv = "1.3.0"
iui = { path = "../../third_party/libui-rs/iui", features = ["plotters"] }
ui-sys = { path = "../../third_party/libui-rs/ui-sys" }
leptos_reactive = {  version = "0.6.4", features = ["serde"] }
nalgebra = { version = "0.35", features = ["serde-serialize"] }
serde = "1.0.193"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "rt", "sync", "time"] }
odyssey-cv = { workspace = true, features = ["telemetry"] }
odyssey-common = { path = "../../crates/odyssey-common", features = ["std"] }
odyssey-playback = { path = "../../crates/odyssey-playback" }
odyssey-usb = { workspace = true }
odyssey-protocol = { path = "../../crates/odyssey-protocol" }
tokio-stream = { workspace = true }
pin-project = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
enumn = { workspace = true }
parking_lot = { workspace = true }
opencv-ros-camera = { git = "https://github.com/Abrahamh08/opencv-ros-camera", branch = "pod-minicbor-repro" }
cam-geom = { workspace = true }
socket2 = "0.6.0"
plotters = { version = "0.3.6", default-features = false, features = ["line_series", "point_series", "surface_series", "colormaps", "full_palette"] }
app_dirs2 = { workspace = true }
serde_json = { workspace = true }
bevy = { version = "0.17.2", optional = true }
bevy_infinite_grid = { git = "https://github.com/XYCaptain/bevy_infinite_grid.git", branch = "main", optional = true }
bevy_atmosphere = { version = "0.13.0", optional = true }
num-traits = { workspace = true }
num-derive = { workspace = true }
cobs = "0.4.0"
nusb = { workspace = true, features = ["tokio"] }
postcard = { workspace = true, features = ["use-std"] }

# For mux-cli
clap = { workspace = true, features = ["derive"] }
