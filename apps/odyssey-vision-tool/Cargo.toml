[package]
name = "odyssey-vision-tool"
version = "0.1.0"
edition = "2024"
default-run = "odyssey-vision-tool"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[features]
bevy = ["dep:bevy", "dep:bevy_infinite_grid"]

[dependencies]
ahrs = { workspace = true, features = ["field_access"] }
anyhow = { workspace = true }
arrayvec = { workspace = true }
csv = "1.3.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.38"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
nalgebra = { version = "0.35", features = ["serde-serialize"] }
serde = "1.0.193"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "rt", "sync", "time"] }
odyssey-cv = { workspace = true, features = ["telemetry"] }
odyssey-common = { path = "../../crates/odyssey-common", features = ["std"] }
odyssey-usb = { workspace = true }
odyssey-protocol = { path = "../../crates/odyssey-protocol" }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
enumn = { workspace = true }
parking_lot = { workspace = true }
opencv-ros-camera = { git = "https://github.com/Abrahamh08/opencv-ros-camera", branch = "pod-minicbor-repro" }
cam-geom = { workspace = true }
socket2 = "0.6.0"
app_dirs2 = { workspace = true }
serde_json = { workspace = true }
bevy = { version = "0.17.2", optional = true, default-features = false, features = ["std", "async_executor", "bevy_pbr", "bevy_winit", "bevy_log", "multi_threaded", "x11", "wayland", "tonemapping_luts", "ktx2", "zstd_rust"] }
bevy_infinite_grid = { version = "0.17.0", optional = true }
num-traits = { workspace = true }
nusb = { workspace = true, features = ["tokio"] }
postcard = { workspace = true, features = ["use-std"] }

# For mux-cli
clap = { workspace = true, features = ["derive"] }

[dev-dependencies]
odyssey-playback = { path = "../../crates/odyssey-playback" }
