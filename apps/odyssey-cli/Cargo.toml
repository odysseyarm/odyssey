[package]
name = "odyssey-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "odyssey-cli"
path = "src/main.rs"

[dependencies]
argmin = { workspace = true }
argmin-math = { workspace = true, features = ["vec"] }
odyssey-usb = { workspace = true }
odyssey-protocol = { path = "../../crates/odyssey-protocol" }
clap = { workspace = true, features = ["derive"] }
futures = "0.3.30"
nalgebra = "0.35"
nusb = { workspace = true }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = { workspace = true }
serialport = { workspace = true, features = ["usbportinfo-interface"] }
tokio = { workspace = true, features = ["signal", "io-std", "io-util", "macros", "rt-multi-thread"] }
anyhow = { workspace = true }
rand = "0.8"
