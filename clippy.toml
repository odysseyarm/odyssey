# Clippy configuration for the host workspace. Clippy searches upward from each
# crate, so this also reaches firmware/ and sdk/ when they are linted from here.
#
# The lint levels themselves live in [workspace.lints.clippy] in Cargo.toml;
# this file only holds the options those lints read.

# Tests may unwrap, expect, dbg! and print: a failed unwrap is the failure
# report, and the output is what you read when a test goes wrong.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Wildcard imports (`wildcard_imports`, warn in Cargo.toml) stay at clippy's
# defaults, which already allow exactly the cases we accept: `use super::*` in a
# test module, `prelude` modules (`dioxus::prelude::*`), enum variants, and
# `pub use` facades over generated code. Anything else is spelled out. The one
# suppression is `use tonic::codegen::*` emitted into odyssey-hub-server-interface's
# generated proto module.
