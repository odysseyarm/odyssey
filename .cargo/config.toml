[alias]
bin = ["run", "--package", "cargo-bin", "--"]
# `cargo lint`: every first-party crate, tests and examples included. The
# vendored libui-rs crates are left out; their generated bindings trip clippy's
# default-deny lints and we do not maintain them.
#
# dead_code_pub_in_binary is allowed here because rustc also fires it on the
# test harness of every library crate (the harness is a binary, so any pub item
# the tests do not touch looks dead). `cargo lint-bins` runs it where it is
# accurate: only the real binaries.
lint = ["clippy", "--workspace", "--all-targets", "--exclude", "iui", "--exclude", "ui-sys", "--", "-A", "dead_code_pub_in_binary"]
lint-bins = ["clippy", "--workspace", "--bins", "--exclude", "iui", "--exclude", "ui-sys"]

# odyssey-cv is a private repo fetched over SSH. Cargo's built-in git transport
# only tries ssh-agent, which fails on machines that key off ~/.ssh/config or an
# IdentityFile instead; shelling out to git picks up the normal ssh setup.
[net]
git-fetch-with-cli = true
