[workspace]
resolver = "2"

members = [
    "apps/odyssey-cli",
    "apps/odyssey-desktop",
    "apps/odyssey-hub",
    "apps/odyssey-usb-cli",
    "apps/odyssey-vision-tool",
    "crates/odyssey-autocalib",
    "crates/odyssey-common",
    "crates/odyssey-hub-client",
    "crates/odyssey-hub-common",
    "crates/odyssey-hub-server",
    "crates/odyssey-hub-server-interface",
    "crates/odyssey-playback",
    "crates/odyssey-protocol",
    "crates/odyssey-protocol-macros",
    "crates/odyssey-usb",
    "third_party/libui-rs/iui",
    "third_party/libui-rs/ui-sys",
    "tools/cargo-bin",
]

# sdk/* are excluded (not just left out of members) so they get their own
# Cargo.lock: odyssey-hub-server depends on odyssey-cv over an SSH git URL that
# CI can't authenticate to, and a shared workspace lock forces cargo to resolve
# every member's dependencies even when building with -p for a single package.
# Neither FFI nor uniffi depend on odyssey-hub-server, so their own lockfiles
# never touch odyssey-cv.
#
# firmware/* is excluded for a different reason: those crates are no_std, build
# for thumb targets on a nightly toolchain and carry their own lockfiles per
# board, so they cannot share a resolution with the host workspace.
exclude = [
    "sdk/odyssey-hub-client-ffi",
    "sdk/odyssey-hub-client-uniffi",
    "firmware",
]

[workspace.dependencies]
ahrs = { git = "https://github.com/jmagnuson/ahrs-rs", rev = "0b04dfe5e23fd0af9dbea1d24116e4c5b69d3ed9" }
anyhow = "1.0.81"
app_dirs2 = "2.5.5"
argmin = "0.11"
argmin-math = "0.5"
arrayvec = "0.7.4"
btleplug = "0.11.8"
cam-geom = "0.17"
clap = "4.5.11"
dfu-nusb = { git = "https://github.com/florg-32/dfu-nusb", branch = "bump-nusb-0.2" }
enumn = "0.1.14"
futures-concurrency = "7.6.1"
heapless = "0.9.2"
hex = "0.4.3"
interprocess = "2.2"
minicbor = { git = "https://github.com/Abrahamh08/minicbor" }
num-derive = "0.4.2"
num-traits = "0.2.19"
nusb = "0.2.1"
odyssey-autocalib = { path = "crates/odyssey-autocalib" }
odyssey-cv = { git = "ssh://git@github.com/odysseyarm/odyssey-cv.git" }
odyssey-hub-client = { path = "crates/odyssey-hub-client" }
odyssey-hub-common = { path = "crates/odyssey-hub-common" }
odyssey-hub-server = { path = "crates/odyssey-hub-server" }
odyssey-hub-server-interface = { path = "crates/odyssey-hub-server-interface" }
odyssey-usb = { path = "crates/odyssey-usb" }
parking_lot = "0.12.1"
pin-project = "1.1.5"
postcard = "1.1.3"
reqwest = "0.12"
serde_json = "1.0.128"
serial2 = "0.2.20"
serialport = "4.3.0"
sha2 = "0.10"
tokio = "1.48.0"
tokio-stream = "0.1.15"
tokio-util = "0.7.15"
tonic = "0.11.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
uuid = "1.18.0"

# cargo-run-bin only reads this from the workspace root.
# https://github.com/dustinblackman/cargo-run-bin
[workspace.metadata.bin]
dioxus-cli = { version = "0.7.10", locked = true, bins = ["dx"] }

# Enable optimizations for dependencies in dev profile
[profile.dev.package."*"]
opt-level = 3

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

# opencv-ros-camera is deliberately unpinned here: odyssey-cv depends on the same
# fork without a rev, and a rev on our side would make them two distinct
# sources with incompatible types. Cargo.lock is the pin.

[patch."https://github.com/odysseyarm/odyssey"]
odyssey-common = { path = "crates/odyssey-common" }
