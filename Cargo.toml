[workspace]
resolver = "2"

# Flat layout: every host crate lives directly under crates/, in a folder named
# exactly like the crate. Internal crates are version 0.0.0 (never published);
# odyssey-desktop keeps its real version because releases and the update check
# read it.
members = ["crates/*"]

# sdk/* are excluded (not just left out of members) so they get their own
# Cargo.lock: odyssey-hub-server depends on odyssey-cv over an SSH git URL that
# CI can't authenticate to, and a shared workspace lock forces cargo to resolve
# every member's dependencies even when building with -p for a single package.
# Neither FFI nor uniffi depend on odyssey-hub-server, so their own lockfiles
# never touch odyssey-cv.
#
# firmware/* is excluded for a different reason: those crates are no_std, build
# for thumb targets on a nightly toolchain and carry their own lockfiles per
# board, so they cannot share a resolution with the host workspace.
exclude = [
    "sdk/odyssey-hub-client-ffi",
    "sdk/odyssey-hub-client-uniffi",
    "firmware",
    # Excluded so it carries its own small lockfile: the firmware release
    # workflows run it and cannot fetch odyssey-cv (see sdk/* above).
    "crates/xtask",
]

# One source for metadata every member shares. `license` names the repository's
# LICENSE file (MIT); a crate that is licensed differently says so itself.
[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/odysseyarm/odyssey"

# One lint policy for every first-party crate. Each member opts in with
# `[lints] workspace = true` (cargo warns, via missing_lints_inheritance, when
# one forgets). Cargo cannot override an inherited lint inside one crate, so a
# crate that has a real reason to differ does it in source, with
# `#![expect(lint, reason = "...")]`, which warns once the reason stops being
# true. sdk/* and firmware/ are separate workspace roots with their own
# lockfiles and do not inherit these.
#
# No clippy group is switched on: pedantic, restriction and nursery are
# cherry-picked below, the way jj and bevy do it, because every project that
# enables `pedantic` wholesale then has to switch off 15-20 of its lints again.
# Nothing here needs a `priority`, since nothing is a group.
[workspace.lints.rust]
# Denied, not forbidden: `forbid` cannot be overridden even by `#[expect]`, and
# the FFI crates have to opt in with `#![expect(unsafe_code, reason = "...")]`.
# That attribute is also a greppable inventory of every crate that has unsafe.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
ambiguous_negative_literals = "warn"
# Not enabled: `let_underscore_drop`. Ignoring a closed channel during shutdown
# with `let _ = tx.send(..)` is intentional; swallowed errors require review.
elided_lifetimes_in_paths = "warn"
# Finds unused `pub` items in binary crates, which rustc cannot see on its own.
dead_code_pub_in_binary = "warn"

[workspace.lints.clippy]
# Readability and modernisation (pedantic, low noise).
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
unnested_or_patterns = "warn"
uninlined_format_args = "warn"
explicit_iter_loop = "warn"
explicit_into_iter_loop = "warn"
needless_for_each = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
format_collect = "warn"
format_push_string = "warn"
single_char_pattern = "warn"
stable_sort_primitive = "warn"
unnecessary_semicolon = "warn"
ref_option = "warn"
ignored_unit_patterns = "warn"
inconsistent_struct_constructor = "warn"
match_wildcard_for_single_variants = "warn"
wildcard_imports = "warn"
enum_glob_use = "warn"
used_underscore_binding = "warn"
cast_lossless = "warn"
fn_params_excessive_bools = "warn"
use_self = "warn"
unused_trait_names = "warn"

# Async.
unused_async = "warn"
large_futures = "warn"

# Unsafe and FFI hygiene.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
ptr_as_ptr = "warn"
ref_as_ptr = "warn"
borrow_as_ptr = "warn"
ptr_cast_constness = "warn"
fn_to_numeric_cast_any = "warn"

# Leftovers and panics in production code. Tests are exempt via clippy.toml.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Shared ownership and API shape.
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
map_err_ignore = "warn"
if_then_some_else_none = "warn"
get_unwrap = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
rest_pat_in_fully_bound_structs = "warn"

[workspace.lints.cargo]
# Everything else (unused_dependencies, unused_workspace_dependencies,
# missing_lints_inheritance, ...) is already warn by default and stays there;
# the one addition is a guardrail that nothing in the workspace violates.
non_kebab_case_packages = "warn"

[workspace.dependencies]
ahrs = { git = "https://github.com/jmagnuson/ahrs-rs", rev = "0b04dfe5e23fd0af9dbea1d24116e4c5b69d3ed9" }
app_dirs2 = "2.5.5"
argmin = "0.11"
argmin-math = "0.5"
arrayvec = "0.7.4"
backon = { version = "1.6", default-features = false, features = ["tokio-sleep"] }
# Error type for the applications (libraries keep typed `thiserror` errors).
# `anyhow` bridges third-party optimizer errors; first-party libraries stay typed.
eros = { version = "0.8", features = ["anyhow"] }
btleplug = "0.11.8"
cam-geom = "0.17"
clap = "4.5.11"
dfu-nusb = { git = "https://github.com/florg-32/dfu-nusb", branch = "bump-nusb-0.2" }
enumn = "0.1.14"
futures-concurrency = "7.6.1"
heapless = "0.9.2"
hex = "0.4.3"
interprocess = "2.2"
minicbor = { git = "https://github.com/Abrahamh08/minicbor" }
num-traits = "0.2.19"
nusb = "0.2.1"
odyssey-autocalib = { path = "crates/odyssey-autocalib" }
odyssey-cv = { git = "ssh://git@github.com/odysseyarm/odyssey-cv.git" }
odyssey-hub-client = { path = "crates/odyssey-hub-client" }
odyssey-hub-common = { path = "crates/odyssey-hub-common" }
odyssey-hub-server = { path = "crates/odyssey-hub-server" }
odyssey-hub-server-interface = { path = "crates/odyssey-hub-server-interface" }
odyssey-protocol = { path = "crates/odyssey-protocol" }
odyssey-usb = { path = "crates/odyssey-usb" }
parking_lot = "0.12.1"
pin-project = "1.1.5"
postcard = "1.1.3"
reqwest = "0.12"
serde_json = "1.0.128"
serialport = "4.3.0"
sha2 = "0.10"
tokio = "1.48.0"
tokio-stream = "0.1.15"
tokio-util = "0.7.15"
tonic = "0.11.0"
tracing = "0.1.41"
thiserror = "2.0.17"
tracing-subscriber = "0.3.19"
uuid = "1.18.0"

# cargo-run-bin only reads this from the workspace root.
# https://github.com/dustinblackman/cargo-run-bin
[workspace.metadata.bin]
dioxus-cli = { version = "0.7.10", locked = true, bins = ["dx"] }

[profile.dev.package."*"]
opt-level = 3

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

# opencv-ros-camera is deliberately unpinned here: odyssey-cv depends on the same
# fork without a rev, and a rev here would make them two distinct
# sources with incompatible types. Cargo.lock is the pin.

[patch."https://github.com/odysseyarm/odyssey"]
odyssey-common = { path = "crates/odyssey-common" }

# Local tracker development: build against the sibling odyssey-cv checkout.
[patch."ssh://git@github.com/odysseyarm/odyssey-cv.git"]
odyssey-cv = { path = "../odyssey-cv/crates/odyssey-cv" }
