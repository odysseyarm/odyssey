[workspace]
resolver = "2"

members = [
    "apps/odyssey-cli",
    "apps/odyssey-desktop",
    "apps/odyssey-hub",
    "apps/odyssey-usb-cli",
    "apps/odyssey-vision-tool",
    "crates/odyssey-common",
    "crates/odyssey-hub-client",
    "crates/odyssey-hub-common",
    "crates/odyssey-hub-server",
    "crates/odyssey-hub-server-interface",
    "crates/odyssey-playback",
    "crates/odyssey-protocol",
    "crates/odyssey-usb",
    "third_party/libui-rs/iui",
    "third_party/libui-rs/ui-sys",
    "tools/cargo-bin",
]

# sdk/* are excluded (not just left out of members) so they get their own
# Cargo.lock: odyssey-hub-server depends on ats_cv over an SSH git URL that CI
# can't authenticate to, and a shared workspace lock forces cargo to resolve
# every member's dependencies even when building with -p for a single package.
# Neither FFI nor uniffi depend on odyssey-hub-server, so their own lockfiles
# never touch ats_cv.
exclude = [
    "sdk/odyssey-hub-client-ffi",
    "sdk/odyssey-hub-client-uniffi",
]

# Enable optimizations for dependencies in dev profile
[profile.dev.package."*"]
opt-level = 3

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

# opencv-ros-camera is deliberately unpinned here: ats_cv depends on the same
# fork without a rev, and a rev on our side would make them two distinct
# sources with incompatible types. Cargo.lock is the pin.
